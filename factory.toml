# The factory. Meaning lives here; measurement lives beside what it measures.
# Design record: docs/features/factory/LEDGER.md

[factory]
ref = "main"                 # the ref whose movement is the clock
poll_seconds = 5
port = 4747
db = ".artifacts/factory/events.sqlite"

# ---- sensors: pure reads of the tree at a commit. A command that prints one flat JSON object of numbers.
# The command runs with cwd = a clean checkout of the sha being measured; FACTORY_SHA is set.

[sensor.loc]
run = "node source/pe-tools/packages/factory/sensors/loc.ts"
scope = ["source/**"]

[sensor.markers]
run = "node source/pe-tools/packages/factory/sensors/markers.ts"
scope = ["source/**", "docs/**", ".agents/**", ".claude/**"]

# ---- loops: trigger, sensors, setpoints. Round 1 has no actuators; a loop with no `act` only measures.

[loop.watch]
on = "merge:main"
sense = ["loc", "markers"]
setpoint = { "loc.total" = "down", "markers.shim" = "down", "markers.todo" = "any" }
