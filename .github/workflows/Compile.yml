name: Compile solution

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # LEFT OUT, needs the owner: every C# step (`dotnet tool restore`, `pe-revit doctor`,
      # `dotnet build Pe.Tools.slnx -c Debug.R25 | Debug.R23 | Release.R25`, and the deterministic
      # rung `pe-revit test --project <P>`). The Pe.Revit.Sdk MSBuild SDK and the pe.revit.cli tool
      # pinned in global.json and .config/dotnet-tools.json exist only in the machine-local folder
      # feed that nuget.config names (%USERPROFILE%\source\feeds\pe-revit-sdk, ADR 0006); they are
      # not on nuget.org. A hosted runner cannot restore them. Restore these steps once the SDK
      # family is published to a feed the runner can reach.
      # The same gap leaves out the `pnpm verify` steps that shell to dotnet (codegen:check, r24).

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # corepack reads packageManager from ts/package.json. The repo's Actions policy allows only
      # GitHub-owned and verified actions, and pnpm/action-setup is neither: naming it fails the
      # whole run at startup.
      # ponytail: no pnpm store cache; add one when install time hurts.
      - name: Setup pnpm
        run: corepack enable

      # Format, lint, tsc per package, projections, catalog source hash, repo guards (ts/scripts/gate.ts).
      - name: gate
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile
          pnpm gate
