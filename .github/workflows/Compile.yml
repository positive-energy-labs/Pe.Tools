name: Compile solution

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  csharp:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug.R23, Debug.R24, Debug.R25, Debug.R26, Release.R25]
    env:
      NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Configure CI package sources
        run: |
          # Replace only the runner's config so SDK resolution cannot see the local folder feed.
          Copy-Item .github/nuget.config nuget.config
          dotnet nuget add source https://nuget.pkg.github.com/positive-energy-labs/index.json --name github --configfile nuget.config

      - name: Restore SDK tool
        run: dotnet tool restore

      # Compile only. The SDK supplies Revit reference assemblies from NuGet; deployment,
      # Revit launch, packaging and Revit-backed tests stay on the local machine.
      - name: Restore C#
        run: dotnet restore Pe.Tools.slnx -p:Configuration=${{ matrix.configuration }} -p:DeployAddin=false -p:LaunchRevit=false

      - name: Build C#
        run: dotnet build Pe.Tools.slnx --no-restore -c ${{ matrix.configuration }} -p:DeployAddin=false -p:LaunchRevit=false

      - name: Build standalone close-model tests without running them
        run: dotnet build dotnet/Pe.App.CloseModel.Tests/Pe.App.CloseModel.Tests.csproj -c ${{ matrix.configuration }}

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # repo guards read history and origin/main

      # Cross-language codegen checks remain separate from this TS gate.

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # corepack reads packageManager from ts/package.json. The repo's Actions policy allows only
      # GitHub-owned and verified actions, and pnpm/action-setup is neither: naming it fails the
      # whole run at startup.
      # ponytail: no pnpm store cache; add one when install time hurts.
      - name: Setup pnpm
        run: corepack enable

      # tsc per package, route projections, catalog source hash, repo guards (ts/scripts/gate.ts).
      # LEFT OUT, red on main itself as of 241262ba: `format` (836 files), `lint` (140 errors) and
      # `Page projection` (examples/pods/snowdon-circuits/pages/tour/index.html is stale). Drop the
      # step names below to run the whole gate once those are clean.
      # The route closures are ignored build output that tsc needs, so they are written after the
      # read-only projection check and before the typecheck.
      - name: gate
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile
          pnpm gate route
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @pe/web codegen:routes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm gate types catalog
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # LEFT OUT, needs the owner: host-door.guard.test.ts reads `git log 3dc3d091..HEAD`, and
          # 3dc3d091 is on no branch and not on GitHub (it survives only as a loose object on the
          # owner's machine), so the guard fails in every fresh clone. Rebase it on a pushed commit,
          # then replace these lines with `repo` in the gate call above.
          cd tests/repo-guards
          pnpm exec vp test run --exclude "**/host-door.guard.test.ts"
