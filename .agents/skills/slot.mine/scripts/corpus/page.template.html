<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--grid:#e7e5e4;--bar:#a8b5c4;--barstroke:#64748b;--own:#1c1917;--desc:#a8a29e;--owner:#c2410c;--arc:#0f766e;--panel:#fff;--pbuild:#3b82f622;--pover:#f9731633;--warn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171717;--fg:#e7e5e4;--mut:#a8a29e;--grid:#2a2a28;--bar:#475569;--barstroke:#94a3b8;--own:#e7e5e4;--desc:#78716c;--owner:#fb923c;--arc:#2dd4bf;--panel:#222;--pbuild:#60a5fa26;--pover:#fb923c33;--warn:#fbbf24}}
:root[data-theme=dark]{--bg:#171717;--fg:#e7e5e4;--mut:#a8a29e;--grid:#2a2a28;--bar:#475569;--barstroke:#94a3b8;--own:#e7e5e4;--desc:#78716c;--owner:#fb923c;--arc:#2dd4bf;--panel:#222;--pbuild:#60a5fa26;--pover:#fb923c33;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,Segoe UI,sans-serif}
header{padding:8px 16px;border-bottom:1px solid var(--grid);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{font-size:15px;margin:0 8px 0 0}label{display:flex;gap:6px;align-items:center;color:var(--mut)}
input[type=range]{width:100px}button,select,input[type=search]{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--grid);border-radius:4px;padding:2px 8px;cursor:pointer}
input[type=search]{cursor:text;width:260px}
nav{display:flex;gap:4px;margin-right:8px}nav button.on{background:var(--fg);color:var(--bg)}
.view{display:none}.view.on{display:block}
#wrap{overflow:auto;height:calc(100vh - 98px);position:relative}
#axis{position:sticky;top:0;z-index:3;background:var(--bg)}
svg text{fill:var(--fg);font:11px system-ui,sans-serif}svg .mut{fill:var(--mut)}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--barstroke);border-radius:6px;padding:8px 10px;max-width:420px;z-index:9;display:none;box-shadow:0 4px 18px #0003;font-size:12px}
#tip b{display:block;margin-bottom:3px}.k{color:var(--mut)}
#legend{display:flex;gap:10px;flex-wrap:wrap}#legend span{display:inline-flex;gap:4px;align-items:center}#legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.small{font-size:11px;color:var(--mut)}
#panel{position:fixed;top:0;right:0;width:min(520px,100vw);height:100vh;overflow:auto;background:var(--panel);border-left:1px solid var(--barstroke);box-shadow:-6px 0 24px #0003;padding:14px 16px;z-index:8;display:none}
#panel h2{font-size:14px;margin:0 28px 6px 0}#panel h3{font-size:12px;margin:14px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
#pclose{position:absolute;top:8px;right:10px}
.box{max-width:1100px;margin:0 auto;padding:14px 16px 60px;overflow:auto;height:calc(100vh - 56px)}
table{border-collapse:collapse;width:100%;margin:6px 0 16px}th,td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--grid);vertical-align:top}th{color:var(--mut);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.card{border:1px solid var(--grid);border-radius:6px;padding:8px 10px;margin:8px 0;background:var(--panel)}
.card .hd{display:flex;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:11px;margin-bottom:4px}
.chip{border-radius:3px;padding:0 5px;color:#fff;font-size:11px}
pre{white-space:pre-wrap;word-break:break-word;margin:4px 0;font:12px/1.4 ui-monospace,Consolas,monospace}
details{margin:3px 0}summary{cursor:pointer;color:var(--mut)}
.reply{border-left:3px solid var(--grid);padding-left:8px;color:var(--mut)}
.warn{color:var(--warn);font-weight:600}
.bar{display:inline-block;height:8px;background:var(--barstroke);vertical-align:middle;margin-right:4px;border-radius:2px}
h2.sec{font-size:14px;margin:22px 0 4px}
</style></head><body>
<header>
<h1>Retro</h1>
<nav id="nav"><button data-v="swim" class="on">Swimlane</button><button data-v="owner">Owner</button><button data-v="samples">Samples</button><button data-v="numbers">Numbers</button></nav>
<span id="swimctl" style="display:contents">
<label>min runs <input id="minRuns" type="range" min="0" max="60" value="3"><b id="minRunsV">3</b></label>
<label>min msgs per arc <input id="minArc" type="range" min="1" max="30" value="3"><b id="minArcV">3</b></label>
<label>zoom <input id="zoom" type="range" min="1" max="14" step="0.5" value="1"><b id="zoomV">1x</b></label>
<label><input id="nonroot" type="checkbox" checked> non-root lanes</label>
<label><input id="arcs" type="checkbox" checked> arcs</label>
<label><input id="descc" type="checkbox" checked> descendant commits</label>
<label>sort <select id="sort"><option value="first">first activity</option><option value="usd">spend</option><option value="runs">runs</option><option value="debt">checkpoint debt</option></select></label>
</span>
<button id="loadRoles">Load roles.json</button><input id="rolesFile" type="file" accept=".json" hidden>
<span id="count" class="small"></span>
<div id="legend"></div>
</header>
<div id="v-swim" class="view on"><div id="wrap"><svg id="axis" height="48"></svg><svg id="body"></svg></div></div>
<div id="v-owner" class="view"><div class="box"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input id="oq" type="search" placeholder="search owner turns, replies, lanes"><select id="olane"></select><span id="ocount" class="small"></span></div><div id="olist"></div><button id="omore">show more</button></div></div>
<div id="v-samples" class="view"><div class="box"><p class="small">Blind review. Each card is a final reply with its source hidden; read it, judge it, then reveal who wrote it and what the owner did next. Order is scrambled; the draw is seeded (meta.seed) per (model, role) group.</p><div style="display:flex;gap:10px;align-items:center"><button id="revealAll">reveal all</button><button id="hideAll">hide all</button><span id="scount" class="small"></span></div><div id="slist"></div></div></div>
<div id="v-numbers" class="view"><div class="box" id="nlist"></div></div>
<div id="panel"><button id="pclose">close</button><div id="pbody"></div></div>
<div id="tip"></div>
<script type="application/json" id="retro-data">/*__RETRO_DATA__*/</script>
<script type="application/json" id="retro-roles">/*__RETRO_ROLES__*/</script>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const DATA = JSON.parse($("retro-data").textContent);
const RB = JSON.parse($("retro-roles").textContent || "{}");
let ROLES = RB.roles || {}, DETAIL = RB.detail || {};
const PALETTE = ["#2563eb","#dc2626","#16a34a","#9333ea","#ea580c","#0891b2","#ca8a04","#be185d","#4d7c0f","#475569","#0d9488","#7c3aed"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
const top3 = o => Object.entries(o || {}).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, v]) => k + " " + v).join(", ") || "-";
const money = v => v == null ? "n/a" : "$" + Math.round(v).toLocaleString();
const pct = v => v == null ? "-" : (100 * v).toFixed(1) + "%";
const num = v => v == null ? "-" : Number(v).toLocaleString();
const lanes = DATA.lanes, laneById = Object.fromEntries(lanes.map(l => [l.id, l]));
const t0 = Date.parse(DATA.meta.window[0]), t1 = Date.parse(DATA.meta.window[1]);

function roleOf(l, e) { const r = ROLES[l.short] || ROLES[l.id]; return r ? (r[String(e.n)] || r["*"] || null) : null; }
function roleList() { const s = new Set(); lanes.forEach(l => l.epochs.forEach(e => { const r = roleOf(l, e); if (r) s.add(r); })); return [...s].sort(); }
function roleColor(r) { const i = roleList().indexOf(r); return i < 0 ? "var(--bar)" : PALETTE[i % PALETTE.length]; }
function chip(r) { return r ? `<span class="chip" style="background:${roleColor(r)}">${esc(r)}</span>` : ""; }
function table(head, rows, numCols) {
  numCols = numCols || [];
  return "<table><tr>" + head.map((h, i) => `<th class="${numCols.includes(i) ? "n" : ""}">${esc(h)}</th>`).join("") + "</tr>" +
    rows.map(r => "<tr>" + r.map((c, i) => `<td class="${numCols.includes(i) ? "n" : ""}">${c}</td>`).join("") + "</tr>").join("") + "</table>";
}
function longText(s, n, label) {
  s = s || ""; if (s.length <= n) return `<pre>${esc(s)}</pre>`;
  return `<details><summary>${esc(label ? label + " " : "")}${esc(s.slice(0, n).replace(/\s+/g, " "))} ... (${s.length}+ chars)</summary><pre>${esc(s)}</pre></details>`;
}

// ---------------- tabs
function setView(v) {
  ["swim", "owner", "samples", "numbers"].forEach(k => { $("v-" + k).classList.toggle("on", k === v); });
  [...$("nav").children].forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("swimctl").style.display = v === "swim" ? "contents" : "none";
  if (v !== "swim") closePanel();
  if (v === "owner") drawOwner(); if (v === "samples") drawSamples(); if (v === "numbers") drawNumbers();
}
[...$("nav").children].forEach(b => b.addEventListener("click", () => setView(b.dataset.v)));
$("loadRoles").onclick = () => $("rolesFile").click();
$("rolesFile").onchange = ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(t => { ROLES = Object.assign({}, ROLES, JSON.parse(t)); draw(); }); };

// ---------------- tooltip
const tip = $("tip");
function showTip(ev, html) { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = Math.min(ev.clientX + 14, innerWidth - 440) + "px"; tip.style.top = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px"; }
function hideTip() { tip.style.display = "none"; }
function el(name, attrs, parent, text) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}

// ---------------- swimlane
function epochAt(l, t) {
  for (const e of l.epochs) if (t >= Date.parse(e.start) && t <= Date.parse(e.end) + 1) return e;
  return l.epochs.length ? (t < Date.parse(l.epochs[0].start) ? l.epochs[0] : l.epochs[l.epochs.length - 1]) : null;
}
const EDGES = (() => {
  const m = new Map();
  for (const [a, b, h, n] of DATA.edges) {
    const la = laneById[a]; if (!la || !laneById[b]) continue;
    const t = Date.parse(h + ":30:00.000Z"), e = epochAt(la, t), key = a + "|" + (e ? e.n : 0) + "|" + b;
    const o = m.get(key) || {a, b, ep: e ? e.n : 0, n: 0, tsum: 0};
    o.n += n; o.tsum += t * n; m.set(key, o);
  }
  return [...m.values()].map(o => Object.assign(o, {t: o.tsum / o.n}));
})();
const LABEL_W = 330, ROW = 22, PAD_R = 24, BASE_W = 1100, AXIS_H = 48;

function draw() {
  const minRuns = +$("minRuns").value, minArc = +$("minArc").value, zoom = +$("zoom").value;
  $("minRunsV").textContent = minRuns; $("minArcV").textContent = minArc; $("zoomV").textContent = zoom + "x";
  let ls = lanes.filter(l => l.runs >= minRuns && (l.is_root || $("nonroot").checked));
  const sk = $("sort").value;
  ls.sort((a, b) => sk === "usd" ? (b.usd_excl || 0) - (a.usd_excl || 0) : sk === "runs" ? b.runs - a.runs : sk === "debt" ? b.debt - a.debt : a.first.localeCompare(b.first));
  $("count").textContent = ls.length + " of " + lanes.length + " lanes";
  const W = LABEL_W + BASE_W * zoom + PAD_R, H = ls.length * ROW + 10;
  const x = t => LABEL_W + (t - t0) / (t1 - t0) * BASE_W * zoom;
  const idx = Object.fromEntries(ls.map((l, i) => [l.id, i]));
  const body = $("body"), axis = $("axis");
  body.innerHTML = ""; axis.innerHTML = "";
  body.setAttribute("width", W); body.setAttribute("height", H); axis.setAttribute("width", W);
  // phase band: build / overhaul from survival, under the day labels
  (DATA.phases || []).forEach(p => {
    const xs = x(Math.max(Date.parse(p.start), t0)), xe = Math.max(x(Math.min(Date.parse(p.end), t1)), xs + 3);
    const r = el("rect", {x: xs, y: 34, width: xe - xs, height: 12, fill: p.kind === "overhaul" ? "var(--pover)" : "var(--pbuild)", stroke: "var(--grid)"}, axis);
    el("text", {x: xs + 3, y: 44, class: "mut"}, axis, "P" + p.n + (p.kind === "overhaul" ? " overhaul" : " build"));
    r.addEventListener("mousemove", ev => showTip(ev, `<b>phase ${p.n} ${esc(p.kind)}</b>${fmt(p.start)} to ${fmt(p.end)}<br><span class=k>commits</span> ${p.commits}  <span class=k>del/ins</span> ${p.ratio}<br><span class=k>survival to end</span> ${pct(p.survival)}`));
    r.addEventListener("mouseleave", hideTip);
  });
  const d0 = new Date(t0); d0.setHours(0, 0, 0, 0);
  for (let d = new Date(d0); d.getTime() <= t1; d.setDate(d.getDate() + 1)) {
    const X = x(Math.max(d.getTime(), t0));
    el("line", {x1: X, x2: X, y1: 0, y2: H, stroke: "var(--grid)"}, body);
    el("text", {x: X + 3, y: 14, class: "mut"}, axis, d.toLocaleDateString([], {month: "short", day: "numeric"}));
    if (zoom >= 3) for (let h = 6; h < 24; h += 6) { const hx = x(d.getTime() + h * 3600e3); if (hx > X && d.getTime() + h * 3600e3 < t1) { el("line", {x1: hx, x2: hx, y1: 22, y2: 34, stroke: "var(--grid)"}, axis); el("text", {x: hx + 2, y: 30, class: "mut"}, axis, h + ":00"); } }
  }
  ls.forEach((l, i) => {
    const y = i * ROW + 4;
    if (i % 2) el("rect", {x: 0, y: y - 2, width: W, height: ROW, fill: "var(--grid)", opacity: 0.25}, body);
    const lab = el("text", {x: 4, y: y + 12, class: l.is_root ? "" : "mut", style: "cursor:pointer"}, body, (l.is_root ? "" : "↳ ") + l.short + "  " + l.title.slice(0, 44));
    lab.addEventListener("mousemove", ev => showTip(ev, "<b>" + esc(l.title) + "</b><span class=k>id</span> " + esc(l.id) + "<br><span class=k>runs</span> " + l.runs + " (with exclusive descendants " + l.runs_excl + ")  <span class=k>spend</span> " + (l.no_transcript ? "n/a (no transcript)" : money(l.usd_own)) + " own, " + money(l.usd_excl) + " with exclusive descendants" +
      "<br><span class=k>models</span> " + esc(top3(l.models)) + "<br><span class=k>owner turns</span> " + l.owner.length + "  <span class=k>commits</span> " + l.commits.length + "  <span class=k>checkpoint debt</span> " + l.debt + (l.cap_driven ? "<br><span class=warn>" + l.cap_driven + " epoch boundaries forced by the cap</span>" : "")));
    lab.addEventListener("mouseleave", hideTip);
    l.epochs.forEach(e => {
      const xs = x(Date.parse(e.start)), xe = Math.max(x(Date.parse(e.end)), xs + 2), role = roleOf(l, e);
      const r = el("rect", {x: xs, y: y + 2, width: xe - xs, height: 12, rx: 2, fill: role ? roleColor(role) : "var(--bar)", stroke: "var(--barstroke)", "stroke-width": 0.6, opacity: 0.9, style: "cursor:pointer"}, body);
      r.addEventListener("click", () => openPanel(l, e));
      r.addEventListener("mousemove", ev => showTip(ev, "<b>" + esc(l.title) + "</b>epoch " + e.n + "/" + l.epochs.length + (role ? " <b>[" + esc(role) + "]</b>" : "") + "<br>" + fmt(e.start) + " to " + fmt(e.end) +
        "<br><span class=k>runs</span> " + e.runs + "  <span class=k>owner turns</span> " + e.owner_turns + "  <span class=k>debt</span> " + e.debt + "  <span class=k>tool calls</span> " + e.tool_calls +
        "<br><span class=k>models</span> " + esc(top3(e.models)) + "<br><span class=k>commits</span> " + e.commits + " (+" + e.ins + "/-" + e.dele + ") <span class=k>desc</span> " + e.desc_commits +
        "<br><span class=k>spend</span> " + (l.no_transcript ? "n/a" : money(e.usd)) + (e.usd_desc ? " (+" + money(e.usd_desc) + " desc)" : "") + "<br><span class=k>click for the full epoch</span>"));
      r.addEventListener("mouseleave", hideTip);
    });
    l.owner.forEach(t => el("line", {x1: x(Date.parse(t)), x2: x(Date.parse(t)), y1: y - 1, y2: y + 4, stroke: "var(--owner)", "stroke-width": 1.2}, body));
    if ($("descc").checked) l.desc_commits.forEach(c => el("circle", {cx: x(Date.parse(c[0])), cy: y + 18, r: 1.4, fill: "var(--desc)"}, body));
    l.commits.forEach(c => {
      const dot = el("circle", {cx: x(Date.parse(c[0])), cy: y + 18, r: Math.min(3.5, 1.2 + Math.log10(1 + c[2]) * 0.6), fill: "var(--own)"}, body);
      dot.addEventListener("mousemove", ev => showTip(ev, "<b>" + esc(c[3]) + "</b>" + c[1] + "  " + c[2] + " lines  " + fmt(c[0]))); dot.addEventListener("mouseleave", hideTip);
    });
  });
  if ($("arcs").checked) {
    const g = el("g", {fill: "none"}, body), mx = Math.max(1, ...EDGES.map(e => e.n));
    EDGES.filter(e => e.n >= minArc && idx[e.a] != null && idx[e.b] != null).forEach(e => {
      const X = x(e.t), ya = idx[e.a] * ROW + 10, yb = idx[e.b] * ROW + 10, dy = yb - ya, bend = Math.min(60, 12 + Math.abs(dy) * 0.15);
      const p = el("path", {d: `M${X},${ya} C${X + bend},${ya + dy * 0.25} ${X + bend},${yb - dy * 0.25} ${X},${yb}`, stroke: "var(--arc)", "stroke-width": 0.6 + 2.6 * Math.log(1 + e.n) / Math.log(1 + mx), opacity: 0.45}, g);
      el("circle", {cx: X, cy: ya, r: 2.4, fill: "var(--arc)", opacity: 0.8}, g);
      p.style.pointerEvents = "stroke";
      p.addEventListener("mousemove", ev => { p.setAttribute("opacity", 1); showTip(ev, "<b>" + e.n + " agent messages</b>" + esc(laneById[e.a].short + " " + laneById[e.a].title.slice(0, 40)) + " (epoch " + e.ep + ")<br>to " + esc(laneById[e.b].short + " " + laneById[e.b].title.slice(0, 40)) + "<br>around " + fmt(e.t)); });
      p.addEventListener("mouseleave", () => { p.setAttribute("opacity", 0.45); hideTip(); });
    });
  }
  const rl = roleList();
  $("legend").innerHTML = rl.length ? rl.map((r, i) => `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(r)}</span>`).join("") + '<span class="small">grey = unlabelled</span>'
    : '<span class="small">no roles loaded (bars neutral). orange tick = owner turn, dot = commit landing (dark own, grey exclusive descendants), teal arc = agent messages, band = build/overhaul phase</span>';
}
["minRuns", "minArc", "zoom", "nonroot", "arcs", "descc", "sort"].forEach(id => $(id).addEventListener("input", draw));

// ---------------- epoch side panel
function closePanel() { $("panel").style.display = "none"; }
$("pclose").onclick = closePanel;
function openPanel(l, e) {
  const role = roleOf(l, e), det = (DETAIL[l.short] || {})[String(e.n)] || null;
  const cls = Object.entries(e.classes || {}).sort((a, b) => b[1] - a[1]), mx = Math.max(1, ...cls.map(c => c[1]));
  const laneName = id => laneById[id] ? laneById[id].short + " " + laneById[id].title.slice(0, 36) : id;
  let h = `<h2>${esc(l.title)}</h2><div class="small">${esc(l.id)}  epoch ${e.n}/${l.epochs.length}  ${chip(role)} ${l.is_root ? "" : "(non-root lane)"}</div>`;
  if (det) h += `<div class="card small"><b>${esc(det.role || "")}${det.secondary ? " + " + esc(det.secondary) : ""}</b> (${esc(det.confidence || "?")})<br>${esc(det.evidence || "")}${det.switch ? "<br><b>switch:</b> " + esc(det.switch) : ""}</div>`;
  h += table(["", ""], [
    ["time", fmt(e.start) + " to " + fmt(e.end)], ["runs", e.runs + "  (models " + esc(top3(e.models)) + "; effort " + esc(top3(e.efforts)) + ")"],
    ["owner turns / relays", e.owner_turns + " / " + e.relays], ["checkpoint debt", e.debt + " runs between owner turns"],
    ["inflow from direct children", num(e.inflow_chars) + " chars in " + e.inflow_replies + " final replies"],
    ["commits (own)", e.commits + "  +" + num(e.ins) + " / -" + num(e.dele) + "  test share " + (e.test_share == null ? "-" : e.test_share)], ["commits (exclusive descendants)", e.desc_commits],
    ["spend", (l.no_transcript ? "n/a (no transcript)" : money(e.usd)) + " own" + (e.usd_desc ? ", " + money(e.usd_desc) + " exclusive descendants" : "")],
    ["modules touched", esc(top3(e.modules))], ["flags", esc(top3(e.flags))], ["epoch boundaries", l.cap_driven ? '<span class="warn">' + l.cap_driven + " of this lane's boundaries were forced by the epoch cap</span>" : "natural"]]);
  h += "<h3>tool mix</h3>" + cls.map(([k, v]) => `<div><span class="bar" style="width:${Math.round(150 * v / mx)}px"></span>${esc(k)} ${v}</div>`).join("");
  h += "<h3>edges</h3><div>in: " + (Object.entries(e.msgs_in || {}).map(([k, v]) => esc(laneName(k)) + " " + v).join("; ") || "-") + "</div><div>out: " + (Object.entries(e.msgs_out || {}).map(([k, v]) => esc(laneName(k)) + " " + v).join("; ") || "-") + "</div>";
  if (e.owner_flow) { const f = e.owner_flow; h += `<div class="small">owner before: ${esc(f.prev_owner_turn_thread ? laneName(f.prev_owner_turn_thread) : "-")} (${f.prev_gap_min} min); after, in another thread: ${esc(f.next_owner_turn_in_other_thread ? laneName(f.next_owner_turn_in_other_thread) : "-")} (${f.next_gap_min} min); returned later: ${f.owner_returned_to_thread_later}</div>`; }
  h += `<h3>owner turns (${e.oi.length})</h3>`;
  h += e.oi.map(i => { const o = DATA.owner[i]; return `<div class="card"><div class="hd"><b>${fmt(o.ts)}</b><span>${esc(o.model || "")} ${esc(o.effort || "")}</span><span>${esc(o.src || "")}</span></div>` +
    (o.prev ? `<div class="reply"><div class="small">answering the final reply of ${fmt(o.prev.ts)} (${esc(o.prev.model || "")})</div>${longText(o.prev.text, 220)}</div>` : '<div class="small">no earlier final reply in this thread</div>') +
    `<div><b>owner</b>${longText(o.text, 360)}</div></div>`; }).join("") || '<div class="small">none</div>';
  h += `<h3>other final replies (${e.nfin}; last ${e.fin.length} shown, truncated)</h3>` + e.fin.map(y => `<div class="card"><div class="hd"><b>${fmt(y.ts)}</b><span>${esc(y.model || "")} ${esc(y.effort || "")}</span><span>${y.chars} chars</span></div>${longText(y.text, 200)}</div>`).join("");
  $("pbody").innerHTML = h; $("panel").style.display = "block"; $("panel").scrollTop = 0;
}

// ---------------- owner tab
let oShown = 0;
function ownerFiltered() {
  const q = $("oq").value.toLowerCase().trim(), ln = $("olane").value;
  return DATA.owner.filter(o => (!ln || o.lane === ln) && (!q || (o.text + " " + (o.prev ? o.prev.text : "") + " " + (o.lane_title || "") + " " + (o.lane_short || "")).toLowerCase().includes(q)));
}
function ownerRow(o) {
  const l = laneById[o.lane], role = l ? roleOf(l, {n: o.epoch}) : null;
  return `<div class="card"><div class="hd"><b>${fmt(o.ts)}</b><span>${esc(o.lane_short || "?")} ${esc(o.lane_title || "")}</span><span>epoch ${o.epoch == null ? "-" : o.epoch}</span>${chip(role)}<span>${esc(o.model || "?")} ${esc(o.effort || "")}</span><span>${esc(o.src || "")}</span></div>` +
    (o.prev ? `<div class="reply"><div class="small">preceding final reply, ${fmt(o.prev.ts)} (${esc(o.prev.model || "?")})</div>${longText(o.prev.text, 240)}</div>` : '<div class="small">no earlier final reply in this thread</div>') +
    `<div><b>owner</b>${longText(o.text, 500)}</div></div>`;
}
function drawOwner(more) {
  if (!$("olane").options.length) {
    const used = [...new Set(DATA.owner.map(o => o.lane).filter(Boolean))].sort((a, b) => (laneById[a].first).localeCompare(laneById[b].first));
    $("olane").innerHTML = '<option value="">all lanes</option>' + used.map(id => `<option value="${esc(id)}">${esc(laneById[id].short + " " + laneById[id].title.slice(0, 50))}</option>`).join("");
  }
  const rows = ownerFiltered(); if (!more) oShown = 0;
  const upto = Math.min(rows.length, oShown + 150);
  $("olist").innerHTML = (more ? $("olist").innerHTML : "") + rows.slice(oShown, upto).map(ownerRow).join("");
  oShown = upto; $("ocount").textContent = rows.length + " owner turns (of " + DATA.owner.length + "), oldest first, showing " + oShown;
  $("omore").style.display = oShown < rows.length ? "inline-block" : "none";
}
$("oq").addEventListener("input", () => drawOwner()); $("olane").addEventListener("change", () => drawOwner()); $("omore").onclick = () => drawOwner(true);

// ---------------- samples tab (blind)
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
let samplesDrawn = false;
function drawSamples() {
  if (samplesDrawn) return; samplesDrawn = true;
  const ss = DATA.samples.slice().sort((a, b) => hash(a.id) - hash(b.id));
  $("scount").textContent = ss.length + " replies from " + Object.keys(DATA.sample_pop).length + " (model, role) groups";
  $("slist").innerHTML = ss.map((s, i) => `<div class="card" data-i="${i}"><div class="hd"><b>#${i + 1}</b><span>${s.reply_chars} chars</span><button class="rv">reveal</button></div><pre>${esc(s.reply)}</pre>` +
    `<div class="src" style="display:none"><div class="small"><b>${esc(s.model)} ${esc(s.effort || "")}</b>  ${chip(s.role === "unlabelled" ? null : s.role)} ${esc(s.role)}  lane ${esc(s.lane_short || "?")} ${esc(s.lane_title || "")} epoch ${s.epoch == null ? "-" : s.epoch}  ${fmt(s.ts)}</div>` +
    (s.next_owner ? `<div class="reply"><div class="small">the owner's next turn, ${s.next_owner.gap_min} min later</div>${longText(s.next_owner.text, 400)}</div>` : '<div class="small">no owner turn followed in this thread</div>') + `</div></div>`).join("");
  [...$("slist").querySelectorAll(".rv")].forEach(b => b.addEventListener("click", () => { const d = b.closest(".card").querySelector(".src"); d.style.display = d.style.display === "none" ? "block" : "none"; }));
}
$("revealAll").onclick = () => [...document.querySelectorAll(".src")].forEach(d => d.style.display = "block");
$("hideAll").onclick = () => [...document.querySelectorAll(".src")].forEach(d => d.style.display = "none");

// ---------------- numbers tab
function drawNumbers() {
  const N = DATA.numbers, M = DATA.meta, C = N.coverage, S = N.survival;
  let h = `<h2 class="sec">Bounds and run</h2><div>window <b>${esc(M.window[0])}</b> &le; t &lt; <b>${esc(M.window[1])}</b> (UTC; since inclusive, until exclusive)<br>project ${esc(M.project)}; ${esc(M.main)} head <code>${esc(M.head)}</code><br>command <code>${esc(M.command || "")}</code><br>rendered ${esc(M.rendered)}; roles ${M.roles ? "loaded" : "none"}; stage seconds ${esc(JSON.stringify(M.stage_secs))}</div>`;
  h += `<h2 class="sec">Commit attribution coverage</h2><div class="small">${C.nonmerge} non-merge commits, ${C.merges} merges. Precedence: trailer, commit-line, patch-id, first-mention (weak). Lines are included changed lines (ins+del, generated excluded).</div>` +
    table(["method", "commits", "share", "lines", "line share"], ["trailer", "commit-line", "patch-id", "first-mention", "unknown", "_strong"].map(k => [k === "_strong" ? "strong (first three)" : k, C.methods[k].commits, pct(C.methods[k].share), num(C.methods[k].lines), pct(C.methods[k].line_share)]), [1, 2, 3, 4]);
  h += `<div>threads active ${C.threads_active}; with a transcript ${C.threads_with_transcript}; lanes ${C.lanes} (${C.lanes_with_transcript} with a transcript); provider threads without a transcript file ${C.provider_threads_missing}. Owner turns ${N.owner_turns} (humans at a surface); relays ${N.relays} (agent text through the user role, not counted as owner).</div>`;
  h += `<h2 class="sec">Spend by model</h2><div class="small">priced at usage-model-rates.json; an unpriced model is n/a, never zero. Total over priced models ${money(C.usd_priced)}; unpriced tokens ${num(C.unpriced_tokens)}. Subagent spend sits in the parent thread; Codex fork copies may double count.</div>` +
    table(["model", "usd", "tokens"], Object.entries(C.by_model).sort((a, b) => (b[1].usd || 0) - (a[1].usd || 0)).map(([k, v]) => [esc(k), money(v.usd), num(v.tokens)]), [1, 2]);
  h += `<h2 class="sec">Epochs</h2><div class="small">${N.epoch_stats.lanes} lanes, ${N.epoch_stats.epochs} epochs, ${N.epoch_stats.cap_driven_lanes} lanes with cap-driven boundaries. Rule: ${esc(N.rule.text)}. Parameters: tiny_minutes ${N.rule.tiny_minutes}, tiny_events ${N.rule.tiny_events}, sim ${N.rule.sim}, max_epochs ${N.rule.max_epochs}. Lane spend uses own + exclusive descendants, so lanes sum without double counting.</div>`;
  if (S) {
    h += `<h2 class="sec">Survival at head</h2><div>${num(S.totals.surviving)} of ${num(S.totals.den)} lines added in the window survive at ${esc(S.head.slice(0, 8))} (${pct(S.totals.surviving / S.totals.den)}). Blame flags <code>${esc(S.blame_flags.slice(2).join(" "))}</code>; ${S.skipped} files skipped (binary, huge, or failed). Churn clock ${num(S.churn_total_lines)} lines.</div>`;
    h += "<h2 class=\"sec\">Phases</h2>" + table(["phase", "kind", "from", "to", "commits", "+ins", "-del", "del/ins", "survive to end"], S.phases.map(p => [p.n, p.kind, fmt(p.start), fmt(p.end), p.commits, num(p.ins), num(p.dele), p.del_ins_ratio, pct(p.survival_to_end)]), [4, 5, 6, 7, 8]);
    h += "<h2 class=\"sec\">Lines added in phase N alive at the end of phase N+1</h2>" + table(["phase", "kind", "through end of", "surviving", "of", "share", "reachable commits"], S.next_phase.map(x => [x.phase, x.kind, x.through_end_of_phase, num(x.surviving), num(x.den), pct(x.share), x.reachable_commits + "/" + x.phase_commits]), [3, 4, 5]);
    h += "<h2 class=\"sec\">Survival by churn distance (deciles of the churn clock, 1 = oldest)</h2>" + table(["decile", "commits", "surviving", "of", "share"], S.deciles.map(d => [d.decile, d.commits, num(d.surviving), num(d.ins_den), pct(d.share)]), [1, 2, 3, 4]);
    const grp = (t, rows) => `<h2 class="sec">Survival by ${t}</h2>` + table([t, "commits", "surviving", "of", "share"], rows.map(x => [esc(x.key), x.commits, num(x.surviving), num(x.ins_den), pct(x.share)]), [1, 2, 3, 4]);
    h += grp("model/effort at commit birth", S.by_model) + grp("lane (top 25)", S.by_lane) + grp("attribution method", S.by_method) + grp("phase", S.by_phase);
    h += `<h2 class="sec">Modules <span class="warn">EXPLORATORY</span></h2><div class="small">${esc(S.modules.note)}. $/line uses the module of the file at head; retouch25 = share of file touches whose file was last touched within 25 main commits.</div>` +
      table(["module", "added", "surviving", "survival", "$ (apportioned)", "$ / surviving line", "retouch25", "blast", "test/src", "top co-change"], S.modules.rows.slice(0, 40).map(m => [esc(m.module), num(m.added), num(m.surviving), pct(m.survival), money(m.usd), m.usd_per_surviving_line == null ? "-" : "$" + m.usd_per_surviving_line, m.retouch25 == null ? "-" : m.retouch25, m.blast == null ? "-" : m.blast, m.test_ratio == null ? "-" : m.test_ratio, m.top_co ? esc(m.top_co[0] + " (" + m.top_co[1] + ")") : "-"]), [1, 2, 3, 4, 5, 6, 7, 8]);
  } else h += '<div class="warn">survival stage has not run for this directory</div>';
  $("nlist").innerHTML = h;
}

draw();
</script></body></html>
