<!doctype html><html lang="en"><head><meta charset="utf-8"><title>lineup · variants side by side</title><style>
:root{--ink:#1b1f24;--paper:#f7f6f2;--rule:#d8d5cc;--muted:#6b6f76;--fill:#ebe8df;--agent:#0f766e;--you:#c026d3;--bad:#e11d48;--ok:#15803d;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--sans:system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:13px/1.4 var(--sans)}
button{font:inherit;color:inherit;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:2px 8px;cursor:pointer}button:hover{background:var(--fill)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:inherit;border:1px solid var(--rule);border-radius:3px;padding:2px 6px;background:#fff}input.bad{border-color:var(--bad)}
.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--muted)}.small{font-size:11.5px}.sp{flex:1}
.h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
.sg{font:700 13px var(--sans);display:inline-block;width:14px;text-align:center}
.si{border:1px dashed var(--muted);padding:0 5px;font:11px var(--mono);color:var(--muted);cursor:help}
.empty{color:var(--muted);padding:8px 4px}.link{text-decoration:underline dotted;cursor:pointer}
#top{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--rule)}#top h1{font-size:14px;margin:0;font-weight:600}
dialog#kmodal{width:min(1100px,94vw);height:86vh;padding:0;border:1px solid var(--ink);background:var(--paper);color:var(--ink)}
dialog#kmodal[open]{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
#kmodal header{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule)}
#kmodal section{overflow:auto;padding:8px 12px;min-height:0}#kmodal section+section{border-left:1px solid var(--rule)}
#kmodal pre{font:11px/1.45 var(--mono);white-space:pre-wrap;margin:0}.rb{border-bottom:1px solid var(--rule);padding:6px 0}
/* page */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
#mid{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#stage{overflow:auto;padding:10px}#sheet{border-left:1px solid var(--rule);overflow:auto;padding:0 12px 12px}
#tabs{display:flex;gap:2px}#tabs button{font:12px var(--mono)}
.grid{display:grid;gap:14px;align-items:start}
.vp{border-top:2px solid var(--rule);padding-top:6px;min-width:0}.vp.cur{border-top-color:var(--ink)}
.vp h2{font-size:14px;margin:0;display:flex;gap:8px;align-items:baseline}.vp h2 .mono{font-weight:700}
.pc{font-size:11.5px;margin:4px 0 8px;display:grid;grid-template-columns:auto 1fr;gap:1px 6px}.pc b{font-family:var(--mono)}
table{border-collapse:collapse;width:100%}td,th{padding:3px 6px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);font-weight:600}
td.n{text-align:right;font-family:var(--mono);font-size:12px}
[data-row]{cursor:pointer}tr[data-row]:hover,.cell:hover{background:var(--fill)}
[data-row].sel{outline:1.5px solid var(--ink);outline-offset:-1.5px;background:var(--fill)}
.strip{display:flex;flex-wrap:wrap;gap:2px;margin:2px 0 8px}.cell{width:40px;text-align:center;border:1px solid var(--rule);background:#fff;padding:1px 0}.cell .mono{font-size:9.5px;display:block;color:var(--muted)}
.gh{display:flex;gap:6px;align-items:center;margin:6px 0 2px;font-weight:600}.bd{font:700 10.5px var(--mono);color:#fff;padding:0 4px}
.bar{display:grid;grid-template-columns:60px 1fr 1fr 56px;align-items:center;gap:0;height:18px}.bar .l,.bar .r{height:10px}.bar .l{justify-self:end}.bar .ax{border-left:1px solid var(--ink)}
.rul{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--rule)}.rul .n{font:600 13px var(--mono)}
.chip{border-radius:10px;padding:0 9px;margin:3px 4px 0 0;font-size:12px}.rul input{width:100%;margin-top:4px;font-size:12px}
pre#md{font:11px/1.45 var(--mono);white-space:pre-wrap;background:#fff;border:1px solid var(--rule);padding:8px}
</style></head><body>
<div id="app">
  <div id="top"><h1 id="ttl"></h1><span id="prov"></span><span id="tabs"></span><button id="mode" title="s: side by side, or one at a time"></button>
    <span class="sp"></span><span class="small muted">1-4 picks · ← → cycles · s switches layout · click a row: it lights in every variant</span>
    <button id="send" style="border-color:var(--ink);font-weight:600" title="Writes a verdicts file with every ruling you made, then shows what the agent will do with each.">send to agent</button></div>
  <div id="mid"><div id="stage"></div><div id="sheet"></div></div>
</div>

<!-- DATA: build.py replaces this block from a JSON file. Everything below derives from it. -->
<script type="application/json" id="data">
{"meta":{"title":"lineup · how a rerun's changes are listed","standIn":true,"source":"hand-written fixture","replaces":"rows from a real run diff, and the variants the agent is pitching"},
 "unit":"sf",
 "states":{"same":{"g":"✓","c":"#15803d","t":"unchanged · the rerun kept it"},"changed":{"g":"◐","c":"#6b6f76","t":"changed shape"},"gone":{"g":"⊘","c":"#6b6f76","t":"gone in this run"},"new":{"g":"+","c":"#0f766e","t":"new in this run"},"fail":{"g":"✗","c":"#e11d48","t":"a standing check failed"}},
 "rows":[
  {"id":"R-101","name":"Office","group":"Level 1","state":"same","value":400,"delta":0},
  {"id":"R-102","name":"Conference","group":"Level 1","state":"changed","value":462,"delta":-38},
  {"id":"R-103","name":"Storage","group":"Level 1","state":"changed","value":300,"delta":150},
  {"id":"R-104","name":"Storage","group":"Level 1","state":"gone","value":0,"delta":-150},
  {"id":"R-105","name":"Corridor","group":"Level 1","state":"same","value":360,"delta":0},
  {"id":"R-106","name":"Open office","group":"Level 1","state":"same","value":474,"delta":0},
  {"id":"R-107","name":"Break","group":"Level 1","state":"fail","value":350,"delta":0},
  {"id":"R-201","name":"Lab","group":"Level 2","state":"same","value":820,"delta":0},
  {"id":"R-202","name":"Lab annex","group":"Level 2","state":"new","value":140,"delta":140},
  {"id":"R-203","name":"Office","group":"Level 2","state":"changed","value":210,"delta":12}],
 "variants":[
  {"id":"A","name":"ledger table","kind":"table","pitch":"Every row, every column; sorted as the run lists them.","pros":["nothing hidden","sorts and scans like a ledger"],"cons":["the four changes hide among the unchanged"]},
  {"id":"B","name":"glyph strip","kind":"strip","pitch":"One cell per room, glyph and colour only; words in hover.","pros":["the whole run on one line","a failure is visible at a glance"],"cons":["no numbers without hovering"]},
  {"id":"C","name":"grouped counts","kind":"grouped","pitch":"Per level: a count per state, then only what changed; unchanged collapse to ids.","pros":["scales to hundreds of rooms","answers what changed per level"],"cons":["one more click to see an unchanged room"]},
  {"id":"D","name":"delta bars","kind":"bars","pitch":"Signed area change as a bar from a centre axis.","pros":["size of change is the picture"],"cons":["gone and new read as big bars, not as states"]}],
 "rulings":[
  {"n":1,"q":"Which variant is the base for the next round?","options":["A","B","C","D"]},
  {"n":2,"q":"Are unchanged rows listed at all?","options":["yes","collapsed","no"]},
  {"n":3,"q":"Area change shown as","options":["sf","%","both"]}]}
</script>

<script>
/* ==== kernel v1 · identical in every kit page · copy, never import ==== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const DATA = JSON.parse($('#data').textContent);
const assert = (ok, msg) => { if (!ok) throw new Error('walk: ' + msg); return msg; };
// A page is reduce(state, event) folded over an event log. Only `view` keys ride the URL hash, so a link locates a thing.
function Kernel({ page, init, reduce, render, view = [], verdicts, readback }) {
  const read = all => { const q = new URLSearchParams(location.hash.slice(1)), v = {}; for (const key of view) if (all || q.has(key)) v[key] = q.get(key); return v; };
  const R = (s, e) => e.type !== 'nav' ? reduce(s, e) : Object.keys(e.view).some(key => s[key] !== e.view[key]) ? { ...s, ...e.view } : s;
  const k = { page, log: [], base: { ...init, ...read(false) } };
  k.state = k.base;
  const sync = () => {
    const q = new URLSearchParams(); for (const key of view) if (k.state[key] != null && k.state[key] !== '') q.set(key, k.state[key]);
    const h = q.toString(); if (location.hash.slice(1) !== h) history.replaceState(null, '', location.pathname + location.search + (h ? '#' + h : ''));
    render(k.state, k);
  };
  // an event the reducer refuses (returns the same state) is not logged
  k.fire = ev => { const next = R(k.state, ev); if (next === k.state) return false; k.log.push(ev); k.state = next; sync(); return true; };
  k.undo = () => { if (!k.log.length) return false; k.log.pop(); k.state = k.log.reduce(R, k.base); sync(); return true; };
  k.replay = (events, from = init) => { k.base = from; k.log = []; k.state = from; for (const e of events) { const n = R(k.state, e); if (n !== k.state) { k.log.push(e); k.state = n; } } sync(); };
  k.at = n => k.log.slice(0, n).reduce(R, k.base);
  k.exportVerdicts = () => {
    const d = new Date(), items = verdicts(k.state), file = `${page}-verdicts-${d.toISOString().replace(/[-:]/g, '').slice(0, 15)}.json`;
    const payload = { schema: 'pe.page.verdicts/1', page, file, createdAt: d.toISOString(), data: DATA.meta, view: Object.fromEntries(view.map(v => [v, k.state[v] ?? null])), items, log: k.log };
    if (!window.__check) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' })); a.download = file; a.click(); }
    const rb = readback(items, k.state), m = $('#kmodal');
    m.innerHTML = `<header><b class="mono">${esc(file)}</b><span class="muted small">${window.__check ? 'not downloaded (check run)' : 'downloaded'} · ${items.length} items · the agent reads this file, not the chat</span><span class="sp"></span><button onclick="this.closest('dialog').close()">close (Esc)</button></header>
      <section><div class="h">What the agent will do with it</div>${rb.map(r => `<div class="rb"><span class="mono">${esc(r.id)}</span> ${esc(r.what)}<div class="small">found: ${esc(r.found)}</div><div class="small">next: ${esc(r.next)}${r.approval ? ' <b>(needs your approval)</b>' : ''}</div></div>`).join('') || '<div class="empty">nothing to send: no item is in a sendable state yet</div>'}</section>
      <section><div class="h">JSON</div><pre>${esc(JSON.stringify(payload, null, 2))}</pre></section>`;
    if (!m.open) m.showModal(); return payload;
  };
  addEventListener('hashchange', () => k.fire({ type: 'nav', view: read(true) }));
  document.body.insertAdjacentHTML('beforeend', '<dialog id="kmodal"></dialog>');
  const m = DATA.meta || {}, p = $('#prov');
  if (p) p.outerHTML = m.standIn ? `<span id="prov" class="si" title="${esc('stand-in data; replace with ' + (m.replaces || 'real artifacts') + ' via build.py')}">fixture · stand-in</span>`
    : `<span id="prov" class="mono muted" title="${esc(m.source)}">built ${esc(m.builtAt)} · ${esc(m.source)}</span>`;
  window.__kit = k; sync(); return k;
}
function copyMd(md, out) { out.textContent = md; out.hidden = false; return navigator.clipboard ? navigator.clipboard.writeText(md).then(() => 'copied', () => 'shown below; copy by hand') : Promise.resolve('shown below; copy by hand'); }
/* ==== end kernel ==== */
</script>

<script>
const V = DATA.variants, ROWS = DATA.rows, STS = DATA.states, UNIT = DATA.unit || '';
const VID = V.map(v => v.id), sign = d => (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d);
// ---- the pure module ----
const init = { v: VID[0], mode: 'side', sel: null, answers: {} };
function reduce(s, e) {
  switch (e.type) {
    case 'pick': return VID.includes(e.v) && e.v !== s.v ? { ...s, v: e.v } : s;
    case 'cycle': return { ...s, v: VID[(VID.indexOf(s.v) + e.d + VID.length) % VID.length] };
    case 'mode': return { ...s, mode: s.mode === 'side' ? 'one' : 'side' };
    case 'sel': return (e.id ?? null) === s.sel || (e.id && !ROWS.some(r => r.id === e.id)) ? s : { ...s, sel: e.id ?? null };
    case 'answer': { const r = DATA.rulings.find(r => r.n === e.n); if (!r || !r.options.includes(e.pick)) return s; const a = s.answers[e.n] || { note: '' };
      return { ...s, answers: { ...s.answers, [e.n]: { ...a, pick: a.pick === e.pick ? null : e.pick } } }; }
    case 'note': { const a = s.answers[e.n] || { pick: null }; return (a.note || '') === e.note ? s : { ...s, answers: { ...s.answers, [e.n]: { ...a, note: e.note } } }; }
  }
  return s;
}

// ---- the variants: same rows, different drawing; each row carries data-row so selection lights everywhere ----
const g = st => `<b class="sg" style="color:${STS[st].c}" title="${esc(STS[st].t)}">${STS[st].g}</b>`;
const tip = r => esc(`${r.id} ${r.name} · ${r.group} · ${STS[r.state].t} · ${r.value} ${UNIT} (${sign(r.delta)})`);
const groups = () => [...new Set(ROWS.map(r => r.group))];
const KINDS = {
  table: s => `<table><tr><th></th><th>id</th><th>name</th><th>group</th><th>${esc(UNIT)}</th><th>Δ</th></tr>${ROWS.map(r => `<tr data-row="${r.id}" class="${s.sel === r.id ? 'sel' : ''}" title="${tip(r)}"><td>${g(r.state)}</td><td class="mono">${esc(r.id)}</td><td>${esc(r.name)}</td><td class="muted">${esc(r.group)}</td><td class="n">${r.value}</td><td class="n">${sign(r.delta)}</td></tr>`).join('')}</table>`,
  strip: s => groups().map(gr => `<div class="h">${esc(gr)}</div><div class="strip">${ROWS.filter(r => r.group === gr).map(r => `<span class="cell ${s.sel === r.id ? 'sel' : ''}" data-row="${r.id}" title="${tip(r)}">${g(r.state)}<span class="mono">${esc(r.id)}</span></span>`).join('')}</div>`).join(''),
  grouped: s => groups().map(gr => { const L = ROWS.filter(r => r.group === gr), n = {}; L.forEach(r => n[r.state] = (n[r.state] || 0) + 1);
    const same = L.filter(r => r.state === 'same');
    return `<div class="gh">${esc(gr)} ${Object.keys(STS).filter(st => n[st]).map(st => `<span class="bd" style="background:${STS[st].c}" title="${esc(STS[st].t)}">${STS[st].g}${n[st]}</span>`).join('')}</div>
      <table>${L.filter(r => r.state !== 'same').map(r => `<tr data-row="${r.id}" class="${s.sel === r.id ? 'sel' : ''}" title="${tip(r)}"><td>${g(r.state)}</td><td class="mono">${esc(r.id)}</td><td>${esc(r.name)}</td><td class="n">${sign(r.delta)}</td></tr>`).join('')}</table>
      ${same.length ? `<div class="small muted" style="margin:3px 0">${g('same')} ${same.map(r => `<span data-row="${r.id}" class="${s.sel === r.id ? 'sel' : ''}" title="${tip(r)}">${esc(r.id)}</span>`).join(', ')}</div>` : ''}`; }).join(''),
  bars: s => { const mx = Math.max(1, ...ROWS.map(r => Math.abs(r.delta)));
    return ROWS.map(r => { const w = Math.abs(r.delta) / mx * 100, c = STS[r.state].c;
      return `<div class="bar ${s.sel === r.id ? 'sel' : ''}" data-row="${r.id}" title="${tip(r)}"><span class="mono small">${g(r.state)} ${esc(r.id)}</span><span class="l" style="width:${r.delta < 0 ? w : 0}%;background:${c}"></span><span class="ax"><span class="r" style="display:block;width:${r.delta > 0 ? w : 0}%;background:${c}"></span></span><span class="n mono small">${sign(r.delta)}</span></div>`; }).join(''); } };

function render(s) {
  $('#ttl').textContent = DATA.meta.title || 'lineup';
  $('#tabs').innerHTML = V.map((v, i) => `<button data-pick="${v.id}" class="${s.v === v.id ? 'on' : ''}" title="${esc(v.name)} · key ${i + 1}">${esc(v.id)}</button>`).join('');
  $('#mode').textContent = s.mode === 'side' ? 'side by side' : 'one at a time';
  const shown = s.mode === 'side' ? V : V.filter(v => v.id === s.v);
  $('#stage').innerHTML = `<div class="grid" style="grid-template-columns:repeat(${shown.length},minmax(0,1fr))">${shown.map(v => `<div class="vp ${v.id === s.v ? 'cur' : ''}" data-v="${v.id}">
    <h2><span class="mono">${esc(v.id)}</span>${esc(v.name)}</h2><div class="small muted">${esc(v.pitch || '')}</div>
    <div class="pc">${(v.pros || []).map(p => `<b style="color:var(--ok)">+</b><span>${esc(p)}</span>`).join('')}${(v.cons || []).map(p => `<b style="color:var(--bad)">−</b><span>${esc(p)}</span>`).join('')}</div>
    ${KINDS[v.kind] ? KINDS[v.kind](s) : `<div class="empty">no drawing for kind "${esc(v.kind)}"; add it to KINDS</div>`}</div>`).join('')}</div>`;
  const open = DATA.rulings.filter(r => !s.answers[r.n]?.pick).length;
  $('#sheet').innerHTML = `<div class="h">rulings · ${DATA.rulings.length - open} of ${DATA.rulings.length} made</div>${DATA.rulings.map(r => { const a = s.answers[r.n] || {};
    return `<div class="rul"><span class="n">${r.n}</span><div>${esc(r.q)}<div>${r.options.map(o => `<button class="chip ${a.pick === o ? 'on' : ''}" data-n="${r.n}" data-o="${esc(o)}" title="${esc(V.find(v => v.id === o)?.name || o)}">${esc(o)}</button>`).join('')}</div>
      <input data-note="${r.n}" placeholder="why (optional)" value="${esc(a.note || '')}"></div></div>`; }).join('')}
    <p><button id="copy">copy rulings as markdown</button> <span id="ok" class="small muted"></span></p><pre id="md" hidden></pre>`;
}
function markdown(s) {
  return [`## Rulings · ${DATA.meta.title || 'lineup'} (${new Date().toISOString().slice(0, 10)})`, '', ...DATA.rulings.map(r => { const a = s.answers[r.n] || {};
    return `${r.n}. ${r.q} **${a.pick ? a.pick + (V.find(v => v.id === a.pick) ? ' (' + V.find(v => v.id === a.pick).name + ')' : '') : '(open)'}**${a.note ? ' · ' + a.note : ''}`; }),
    '', '| variant | + | − |', '|---|---|---|', ...V.map(v => `| ${v.id} ${v.name} | ${(v.pros || []).join('; ')} | ${(v.cons || []).join('; ')} |`)].join('\n');
}

// ---- export ----
function verdicts(s) { return DATA.rulings.filter(r => s.answers[r.n]?.pick).map(r => ({ n: r.n, question: r.q, pick: s.answers[r.n].pick, variant: V.find(v => v.id === s.answers[r.n].pick)?.name || null, note: s.answers[r.n].note || null })); }
function readback(items) { return items.map(it => ({ id: 'ruling ' + it.n, what: `${it.question} → ${it.pick}`, found: it.variant ? `variant ${it.pick} (${it.variant}) is in this lineup` : `option "${it.pick}" of ruling ${it.n}`,
  next: it.variant ? `carry ${it.pick} forward as the base of the next round and record ruling ${it.n} in the ledger` : `record ruling ${it.n} = ${it.pick} in the ledger${it.note ? ' with your reason' : ''}`, approval: false })); }

// ---- wiring ----
const k = Kernel({ page: 'lineup', init, reduce, render, view: ['v', 'mode', 'sel'], verdicts, readback });
document.addEventListener('click', e => { if (e.target.closest('dialog')) return; const b = e.target.closest('[data-pick],[data-o],[data-row],#copy,#mode,.vp'); if (!b) return;
  if (b.id === 'copy') return copyMd(markdown(k.state), $('#md')).then(t => $('#ok').textContent = t);
  if (b.id === 'mode') return k.fire({ type: 'mode' });
  if (b.dataset.pick) return k.fire({ type: 'pick', v: b.dataset.pick });
  if (b.dataset.o) return k.fire({ type: 'answer', n: +b.dataset.n, pick: b.dataset.o });
  if (b.dataset.row) return k.fire({ type: 'sel', id: k.state.sel === b.dataset.row ? null : b.dataset.row });
  k.fire({ type: 'pick', v: b.dataset.v }); });
document.addEventListener('change', e => { if (e.target.dataset.note) k.fire({ type: 'note', n: +e.target.dataset.note, note: e.target.value }); });
addEventListener('keydown', e => { if (/INPUT/.test(e.target.tagName) || $('#kmodal').open) return;
  if (/^[1-9]$/.test(e.key) && VID[e.key - 1]) k.fire({ type: 'pick', v: VID[e.key - 1] });
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') k.fire({ type: 'cycle', d: e.key === 'ArrowRight' ? 1 : -1 });
  else if (e.key === 's') k.fire({ type: 'mode' }); else if (e.key === 'Escape') k.fire({ type: 'sel', id: null }); });
$('#send').onclick = () => k.exportVerdicts();

// ---- the walk ----
window.__walk = () => {
  const out = [], key = kk => dispatchEvent(new KeyboardEvent('keydown', { key: kk })); k.replay([]);
  out.push(assert($$('.vp').length === V.length && $$('.vp').every(p => ROWS.every(r => p.querySelector(`[data-row="${r.id}"]`))), `side by side: ${V.length} variants, every row in each`));
  $(`.vp[data-v="${VID[0]}"] [data-row="${ROWS[1].id}"]`).click();
  out.push(assert(k.state.sel === ROWS[1].id && $$(`.sel[data-row="${ROWS[1].id}"]`).length === V.length && location.hash.includes('sel=' + ROWS[1].id), 'a row picked in one variant lights in all; the URL carries it'));
  key('s'); out.push(assert(k.state.mode === 'one' && $$('.vp').length === 1, 's: one at a time'));
  key('3'); key('ArrowRight'); out.push(assert(k.state.v === VID[3 % VID.length] && $('.vp').dataset.v === k.state.v && location.hash.includes('v=' + k.state.v), '3 then →: the fourth variant, in the URL'));
  key('ArrowRight'); out.push(assert(k.state.v === VID[0], '→ wraps to the first'));
  $('[data-n="1"][data-o="B"]').click(); const inp = $('[data-note="1"]'); inp.value = 'the strip scans fastest'; inp.dispatchEvent(new Event('change', { bubbles: true }));
  out.push(assert(k.state.answers[1].pick === 'B' && k.state.answers[1].note && /1 of 3 made/.test($('#sheet .h').textContent), 'ruling 1 = B with a reason; the sheet counts it'));
  $('#copy').click(); out.push(assert(/^1\. .*\*\*B \(glyph strip\)\*\* · the strip scans fastest$/m.test($('#md').textContent) && /\*\*\(open\)\*\*/.test($('#md').textContent), 'copy as markdown: numbered, picks bold, open ones say so'));
  const n = k.log.length; k.undo(); out.push(assert(k.log.length === n - 1 && !k.state.answers[1].note, 'undo drops the reason'));
  const p = k.exportVerdicts(); $('#kmodal').close(); out.push(assert(p.items.length === 1 && p.items[0].variant === 'glyph strip' && $$('#kmodal .rb').length === 1, 'export: one ruling, readback says it carries B forward'));
  k.replay([]); return out;
};
