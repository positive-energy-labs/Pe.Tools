<!doctype html><html lang="en"><head><meta charset="utf-8"><title>diagram · system diagram</title><style>
:root{--ink:#1b1f24;--paper:#f7f6f2;--rule:#d8d5cc;--muted:#6b6f76;--fill:#ebe8df;--agent:#0f766e;--you:#c026d3;--bad:#e11d48;--ok:#15803d;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--sans:system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:13px/1.4 var(--sans)}
button{font:inherit;color:inherit;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:2px 8px;cursor:pointer}button:hover{background:var(--fill)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:inherit;border:1px solid var(--rule);border-radius:3px;padding:2px 6px;background:#fff}input.bad{border-color:var(--bad)}
.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--muted)}.small{font-size:11.5px}.sp{flex:1}
.h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
.sg{font:700 13px var(--sans);display:inline-block;width:14px;text-align:center}
.si{border:1px dashed var(--muted);padding:0 5px;font:11px var(--mono);color:var(--muted);cursor:help}
.empty{color:var(--muted);padding:8px 4px}.link{text-decoration:underline dotted;cursor:pointer}
#top{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--rule)}#top h1{font-size:14px;margin:0;font-weight:600}
dialog#kmodal{width:min(1100px,94vw);height:86vh;padding:0;border:1px solid var(--ink);background:var(--paper);color:var(--ink)}
dialog#kmodal[open]{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
#kmodal header{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule)}
#kmodal section{overflow:auto;padding:8px 12px;min-height:0}#kmodal section+section{border-left:1px solid var(--rule)}
#kmodal pre{font:11px/1.45 var(--mono);white-space:pre-wrap;margin:0}.rb{border-bottom:1px solid var(--rule);padding:6px 0}
/* page */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
#mid{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#board{overflow:auto;background:#fff;position:relative}#board svg{display:block}
#side{border-left:1px solid var(--rule);overflow:auto;padding:0 12px 12px}
.node{cursor:pointer}.node rect.box{fill:#fff;stroke:#b8b6ad}.node:hover rect.box{fill:var(--fill)}.node.on rect.box{stroke:var(--ink);stroke-width:2}
.node.dim{opacity:.22}.node text{pointer-events:none}
.edge path{fill:none;stroke:#b8b6ad;stroke-width:1.5}.edge.faded{opacity:.12}.edge.walked path{stroke:#6b6f76;stroke-width:2}.edge.hot path{stroke:var(--ink);stroke-width:3}
.edge text{font:10.5px var(--mono);fill:#6b6f76;paint-order:stroke;stroke:#fff;stroke-width:4px}.edge.hot text{fill:var(--ink);font-weight:700}
.own{display:inline-flex;align-items:center;gap:5px;margin:2px 4px 2px 0}.own i{width:10px;height:10px;display:inline-block}
.own.off{opacity:.45;text-decoration:line-through}
.pf{font:10.5px var(--mono);padding:0 4px;border:1px solid var(--ink);white-space:nowrap;cursor:help}.pf.suspect{border-style:dashed}.pf.unknown{border-color:var(--bad);color:var(--bad)}.pf.stand-in{border:1px dashed var(--muted);color:var(--muted)}
.fact{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--rule)}
.fact .v button{padding:0 6px;font-size:12px}.fact .v button.on.ok{background:var(--ok);border-color:var(--ok)}.fact .v button.on.wrong{background:var(--bad);border-color:var(--bad)}
.nt{width:100%;font-size:12px;margin-top:3px;grid-column:2/4}
.prog{display:flex;gap:3px;margin:6px 0 10px}.prog span{flex:1;height:9px;border:1px solid var(--ink);cursor:pointer}.prog .done{background:var(--ink)}.prog .cur{outline:2px solid var(--agent);outline-offset:1px}
.step{font-size:13.5px;margin:6px 0}.lk{text-decoration:underline dotted;cursor:pointer}
</style></head><body>
<div id="app">
  <div id="top"><h1 id="ttl"></h1><span id="prov"></span><span class="sp"></span><span class="small muted">click a box: its neighbourhood and facts · ← → steps a flow · Esc backs out</span>
    <button id="send" style="border-color:var(--ink);font-weight:600" title="Writes a verdicts file with every fact and edge you confirmed or disputed, then shows what the agent will do with it.">send to agent</button></div>
  <div id="mid"><div id="board"></div><div id="side"></div></div>
</div>

<!-- DATA: build.py replaces this block from a JSON file. Everything below derives from it. -->
<script type="application/json" id="data">
{"meta":{"title":"diagram · a change, from ask to commit","standIn":true,"source":"hand-written fixture","replaces":"nodes, edges and facts extracted from the real code path, with proof per fact"},
 "owners":{"user":{"label":"you","color":"#c026d3"},"agent":{"label":"agent","color":"#0f766e"},"lib":{"label":"library (typed contract)","color":"#1f4fd6"},"host":{"label":"host bridge","color":"#6b6f76"},"model":{"label":"model document","color":"#e0701b"}},
 "proofs":{"proved":"seen in a file or a run","suspect":"from docs or research, not tried here","unknown":"nobody has checked","stand-in":"invented for this page"},
 "cols":["ask","plan","read","propose","apply"],
 "nodes":[
  {"id":"ask","label":"Ask","owner":"user","col":0,"sub":"a sentence in chat","facts":[{"k":"names a goal, not an operation","proof":"stand-in"}]},
  {"id":"agent","label":"Agent","owner":"agent","col":1,"sub":"plans against the catalog","facts":[{"k":"proposes; never commits on its own","proof":"proved"},{"k":"reads the catalog before the live host","proof":"suspect"}]},
  {"id":"catalog","label":"Operation catalog","owner":"lib","col":1,"sub":"generated from typed DTOs","facts":[{"k":"the public contract; the host cannot add to it","proof":"proved"},{"k":"regenerated on every build","proof":"unknown"}]},
  {"id":"host","label":"Live host","owner":"host","col":2,"sub":"answers availability only","facts":[{"k":"says whether an op can run now, not what it means","proof":"proved"}]},
  {"id":"doc","label":"Document","owner":"model","col":2,"sub":"the open model","facts":[{"k":"element ids survive a save","proof":"suspect"},{"k":"coordinates are in model feet","proof":"proved"}]},
  {"id":"snap","label":"Snapshot","owner":"lib","col":2,"sub":"ids + geometry + run id","facts":[{"k":"every row carries the run that made it","proof":"stand-in"}]},
  {"id":"prop","label":"Proposal","owner":"agent","col":3,"sub":"staged, not applied","facts":[{"k":"a diff against one snapshot","proof":"stand-in"}]},
  {"id":"review","label":"Review","owner":"user","col":3,"sub":"approve, edit, reject","facts":[{"k":"an edit clears approval","proof":"unknown"}]},
  {"id":"txn","label":"Transaction","owner":"host","col":4,"sub":"one commit per approval","facts":[{"k":"rolls back whole on any failure","proof":"suspect"}]}],
 "edges":[
  {"from":"ask","to":"agent","label":"request"},{"from":"agent","to":"catalog","label":"look up op"},{"from":"agent","to":"host","label":"can it run?"},
  {"from":"host","to":"doc","label":"read"},{"from":"doc","to":"snap","label":"export"},{"from":"snap","to":"prop","label":"diff against"},
  {"from":"agent","to":"prop","label":"stage"},{"from":"prop","to":"review","label":"show"},{"from":"review","to":"prop","label":"edit"},
  {"from":"review","to":"txn","label":"approve"},{"from":"txn","to":"doc","label":"commit"},{"from":"txn","to":"snap","label":"fresh run id"}],
 "flows":[
  {"id":"approve","name":"propose, then approve","steps":[
   {"e":"ask>agent","note":"You ask for an outcome in words."},{"e":"agent>catalog","note":"The agent finds the typed operation that does it."},
   {"e":"agent>host","note":"The live host says whether that op can run in this session."},{"e":"host>doc","note":"The host reads the open document."},
   {"e":"doc>snap","note":"The read lands as a snapshot: ids, geometry, the run id."},{"e":"snap>prop","note":"The proposal is a diff against that one snapshot."},
   {"e":"prop>review","note":"You see the proposal before anything changes."},{"e":"review>txn","note":"Approval opens one transaction."},
   {"e":"txn>doc","note":"The commit lands in the document."}]},
  {"id":"edit","name":"edit loop","steps":[
   {"e":"prop>review","note":"You see the proposal."},{"e":"review>prop","note":"You edit it; the edit clears any approval."},
   {"e":"prop>review","note":"The edited proposal comes back for approval."},{"e":"review>txn","note":"You approve the edited version."},
   {"e":"txn>snap","note":"The next snapshot carries a fresh run id."}]}]}
</script>

<script>
/* ==== kernel v1 · identical in every kit page · copy, never import ==== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const DATA = JSON.parse($('#data').textContent);
const assert = (ok, msg) => { if (!ok) throw new Error('walk: ' + msg); return msg; };
// A page is reduce(state, event) folded over an event log. Only `view` keys ride the URL hash, so a link locates a thing.
function Kernel({ page, init, reduce, render, view = [], verdicts, readback }) {
  const read = all => { const q = new URLSearchParams(location.hash.slice(1)), v = {}; for (const key of view) if (all || q.has(key)) v[key] = q.get(key); return v; };
  const R = (s, e) => e.type !== 'nav' ? reduce(s, e) : Object.keys(e.view).some(key => s[key] !== e.view[key]) ? { ...s, ...e.view } : s;
  const k = { page, log: [], base: { ...init, ...read(false) } };
  k.state = k.base;
  const sync = () => {
    const q = new URLSearchParams(); for (const key of view) if (k.state[key] != null && k.state[key] !== '') q.set(key, k.state[key]);
    const h = q.toString(); if (location.hash.slice(1) !== h) history.replaceState(null, '', location.pathname + location.search + (h ? '#' + h : ''));
    render(k.state, k);
  };
  // an event the reducer refuses (returns the same state) is not logged
  k.fire = ev => { const next = R(k.state, ev); if (next === k.state) return false; k.log.push(ev); k.state = next; sync(); return true; };
  k.undo = () => { if (!k.log.length) return false; k.log.pop(); k.state = k.log.reduce(R, k.base); sync(); return true; };
  k.replay = (events, from = init) => { k.base = from; k.log = []; k.state = from; for (const e of events) { const n = R(k.state, e); if (n !== k.state) { k.log.push(e); k.state = n; } } sync(); };
  k.at = n => k.log.slice(0, n).reduce(R, k.base);
  k.exportVerdicts = () => {
    const d = new Date(), items = verdicts(k.state), file = `${page}-verdicts-${d.toISOString().replace(/[-:]/g, '').slice(0, 15)}.json`;
    const payload = { schema: 'pe.page.verdicts/1', page, file, createdAt: d.toISOString(), data: DATA.meta, view: Object.fromEntries(view.map(v => [v, k.state[v] ?? null])), items, log: k.log };
    if (!window.__check) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' })); a.download = file; a.click(); }
    const rb = readback(items, k.state), m = $('#kmodal');
    m.innerHTML = `<header><b class="mono">${esc(file)}</b><span class="muted small">${window.__check ? 'not downloaded (check run)' : 'downloaded'} · ${items.length} items · the agent reads this file, not the chat</span><span class="sp"></span><button onclick="this.closest('dialog').close()">close (Esc)</button></header>
      <section><div class="h">What the agent will do with it</div>${rb.map(r => `<div class="rb"><span class="mono">${esc(r.id)}</span> ${esc(r.what)}<div class="small">found: ${esc(r.found)}</div><div class="small">next: ${esc(r.next)}${r.approval ? ' <b>(needs your approval)</b>' : ''}</div></div>`).join('') || '<div class="empty">nothing to send: no item is in a sendable state yet</div>'}</section>
      <section><div class="h">JSON</div><pre>${esc(JSON.stringify(payload, null, 2))}</pre></section>`;
    if (!m.open) m.showModal(); return payload;
  };
  addEventListener('hashchange', () => k.fire({ type: 'nav', view: read(true) }));
  document.body.insertAdjacentHTML('beforeend', '<dialog id="kmodal"></dialog>');
  const m = DATA.meta || {}, p = $('#prov');
  if (p) p.outerHTML = m.standIn ? `<span id="prov" class="si" title="${esc('stand-in data; replace with ' + (m.replaces || 'real artifacts') + ' via build.py')}">fixture · stand-in</span>`
    : `<span id="prov" class="mono muted" title="${esc(m.source)}">built ${esc(m.builtAt)} · ${esc(m.source)}</span>`;
  window.__kit = k; sync(); return k;
}
function copyMd(md, out) { out.textContent = md; out.hidden = false; return navigator.clipboard ? navigator.clipboard.writeText(md).then(() => 'copied', () => 'shown below; copy by hand') : Promise.resolve('shown below; copy by hand'); }
/* ==== end kernel ==== */
</script>

<script>
// ---- layout: columns from data, rows by order within a column ----
const O = DATA.owners, N = Object.fromEntries(DATA.nodes.map(n => [n.id, n])), EK = e => e.from + '>' + e.to, E = Object.fromEntries(DATA.edges.map(e => [EK(e), e]));
const NW = 180, NH = 52, CW = 260, RH = 96, PX = 30, PY = 44, rowOf = {}, cnt = {};
for (const n of DATA.nodes) { rowOf[n.id] = cnt[n.col] = (cnt[n.col] ?? -1) + 1; }
const box = id => { const n = N[id]; return { x: PX + n.col * CW, y: PY + rowOf[id] * RH }; };
const W = PX * 2 + (DATA.cols.length - 1) * CW + NW, H = PY + Math.max(...Object.values(cnt)) * RH + NH + 70;
function geom(e) {   // a cubic from A to B; returns path d and the label point (the curve at t = .5)
  const a = box(e.from), b = box(e.to); let P;
  if (N[e.to].col > N[e.from].col) P = [[a.x + NW, a.y + NH / 2], null, null, [b.x - 4, b.y + NH / 2]], P[1] = [(P[0][0] + P[3][0]) / 2, P[0][1]], P[2] = [(P[0][0] + P[3][0]) / 2, P[3][1]];
  else if (N[e.to].col === N[e.from].col && Math.abs(rowOf[e.to] - rowOf[e.from]) === 1) { const dn = rowOf[e.to] > rowOf[e.from], x = a.x + NW * (dn ? .35 : .65), y0 = dn ? a.y + NH : a.y, y1 = dn ? b.y - 4 : b.y + NH + 4;
    P = [[x, y0], [x, (y0 + y1) / 2], [x, (y0 + y1) / 2], [x, y1]]; }
  else if (N[e.to].col === N[e.from].col) P = [[a.x + NW, a.y + NH / 2], [a.x + NW + 40, a.y + NH / 2], [b.x + NW + 40, b.y + NH / 2], [b.x + NW + 4, b.y + NH / 2]];
  else { const low = Math.max(a.y, b.y) + NH + 34; P = [[a.x + NW / 2, a.y + NH], [a.x + NW / 2, low], [b.x + NW / 2, low], [b.x + NW / 2 + 6, b.y + NH + 4]]; }
  const m = [0, 1].map(i => (P[0][i] + 3 * P[1][i] + 3 * P[2][i] + P[3][i]) / 8);
  return { d: `M${P[0]} C${P[1]} ${P[2]} ${P[3]}`, m };
}

// ---- the pure module ----
const init = { focus: null, flow: null, step: null, off: '', marks: {} };
const offSet = s => new Set((s.off || '').split(',').filter(Boolean)), shown = (s, id) => !offSet(s).has(N[id].owner);
const flowOf = s => DATA.flows.find(f => f.id === s.flow) || null, stepOf = s => Math.max(0, +s.step || 0);
function reduce(s, e) {
  switch (e.type) {
    case 'focus': return !N[e.id] && e.id !== null ? s : e.id && !shown(s, e.id) ? s : { ...s, focus: s.focus === e.id ? null : e.id, flow: null, step: null };
    case 'owner': { if (!O[e.id]) return s; const o = offSet(s); o.has(e.id) ? o.delete(e.id) : o.add(e.id); const off = [...o].join(',');
      return { ...s, off, focus: s.focus && o.has(N[s.focus].owner) ? null : s.focus }; }
    case 'flow': return e.id === null ? (s.flow ? { ...s, flow: null, step: null } : s) : DATA.flows.some(f => f.id === e.id) ? { ...s, flow: e.id, step: '0', focus: null } : s;
    case 'step': { const f = flowOf(s); if (!f) return s; const n = Math.min(f.steps.length - 1, Math.max(0, e.to ?? stepOf(s) + e.d)); return n === stepOf(s) ? s : { ...s, step: String(n) }; }
    case 'mark': { const m = { ...s.marks }, cur = m[e.key]; if (cur?.v === e.v) delete m[e.key]; else m[e.key] = { v: e.v, note: cur?.note || '' }; return { ...s, marks: m }; }
    case 'note': return s.marks[e.key] && s.marks[e.key].note !== e.note ? { ...s, marks: { ...s.marks, [e.key]: { ...s.marks[e.key], note: e.note } } } : s;
  }
  return s;
}

// ---- render ----
const pf = p => `<span class="pf ${esc(p)}" title="${esc(p + ': ' + (DATA.proofs[p] || ''))}">${esc(p)}</span>`;
const nodeName = id => `<span class="lk" data-focus="${id}" title="${esc(O[N[id].owner].label)}"><i style="display:inline-block;width:8px;height:8px;background:${O[N[id].owner].color}"></i> ${esc(N[id].label)}</span>`;
function verbs(s, key) { const m = s.marks[key];
  return `<span class="v">${[['ok', '✓', 'confirm: this is true as drawn'], ['wrong', '✗', 'dispute: this is wrong; say why']].map(([v, g, t]) => `<button data-mark="${esc(key)}" data-v="${v}" class="${m?.v === v ? 'on ' + v : ''}" title="${t}">${g}</button>`).join('')}</span>`
    + (m ? `<input class="nt" data-key="${esc(key)}" placeholder="${m.v === 'wrong' ? 'what is true instead?' : 'how you know (optional)'}" value="${esc(m.note)}">` : ''); }
function render(s) {
  $('#ttl').textContent = DATA.meta.title || 'diagram';
  const f = flowOf(s), i = stepOf(s), walked = f ? new Set(f.steps.slice(0, i).map(x => x.e)) : null, hot = f ? f.steps[i].e : null;
  const hood = s.focus ? new Set([s.focus, ...DATA.edges.flatMap(e => e.from === s.focus ? [e.to] : e.to === s.focus ? [e.from] : [])]) : null;
  const onPath = f ? new Set(f.steps.slice(0, i + 1).flatMap(x => x.e.split('>'))) : null;
  const edges = DATA.edges.filter(e => shown(s, e.from) && shown(s, e.to)), nodes = DATA.nodes.filter(n => shown(s, n.id));
  const disputed = id => Object.entries(s.marks).filter(([k, m]) => m.v === 'wrong' && k.startsWith('node:' + id + ':')).length;
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px"><defs>${['a', 'h'].map(k => `<marker id="m${k}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0L10,5L0,10z" fill="${k === 'h' ? '#1b1f24' : '#b8b6ad'}"/></marker>`).join('')}</defs>
    ${DATA.cols.map((c, j) => `<text x="${PX + j * CW}" y="24" style="font:600 11px var(--sans);letter-spacing:.08em;fill:#6b6f76;text-transform:uppercase">${esc(c)}</text>`).join('')}
    ${edges.map(e => { const g = geom(e), k = EK(e), cls = hot === k ? 'hot' : walked?.has(k) ? 'walked' : (hood && !(e.from === s.focus || e.to === s.focus)) || (f && !walked.has(k)) ? 'faded' : '';
      const m = s.marks['edge:' + k]; return `<g class="edge ${cls}" data-e="${k}"><path d="${g.d}" marker-end="url(#m${hot === k ? 'h' : 'a'})"/><text x="${g.m[0]}" y="${g.m[1] - 4}" text-anchor="middle">${esc(e.label)}${m ? (m.v === 'wrong' ? ' ✗' : ' ✓') : ''}</text></g>`; }).join('')}
    ${nodes.map(n => { const b = box(n.id), dim = (hood && !hood.has(n.id)) || (onPath && !onPath.has(n.id)), d = disputed(n.id);
      return `<g class="node ${s.focus === n.id ? 'on' : ''} ${dim ? 'dim' : ''}" data-focus="${n.id}"><title>${esc(n.label + ' · ' + O[n.owner].label + (n.sub ? '\n' + n.sub : ''))}</title>
        <rect class="box" x="${b.x}" y="${b.y}" width="${NW}" height="${NH}"/><rect x="${b.x}" y="${b.y}" width="6" height="${NH}" fill="${O[n.owner].color}"/>
        <text x="${b.x + 14}" y="${b.y + 21}" style="font:600 13px var(--sans)">${esc(n.label)}</text><text x="${b.x + 14}" y="${b.y + 39}" style="font:11px var(--sans);fill:#6b6f76">${esc(n.sub || '')}</text>
        ${d ? `<rect x="${b.x + NW - 26}" y="${b.y - 8}" width="26" height="15" fill="#e11d48"/><text x="${b.x + NW - 13}" y="${b.y + 3}" text-anchor="middle" style="font:700 10.5px var(--mono);fill:#fff">✗${d}</text>` : ''}</g>`; }).join('')}</svg>`;
  $('#board').innerHTML = nodes.length ? svg : `<div class="empty" style="padding:20px">every owner is filtered out · <span class="link" data-alloff="1">show all</span></div>`;
  const owners = `<div class="h">owners · click to hide or show</div>${Object.entries(O).map(([id, o]) => `<button class="own ${offSet(s).has(id) ? 'off' : ''}" data-owner="${id}" title="${esc(o.label)}: ${DATA.nodes.filter(n => n.owner === id).length} boxes"><i style="background:${o.color}"></i>${esc(o.label)}</button>`).join('')}`;
  let body;
  if (f) { const st = f.steps[i], e = E[st.e];
    body = `<div class="h">flow · ${esc(f.name)} · step ${i + 1} of ${f.steps.length}</div><div class="prog">${f.steps.map((x, j) => `<span data-step="${j}" class="${j < i ? 'done' : ''} ${j === i ? 'cur' : ''}" title="${esc(x.e.replace('>', ' → '))}"></span>`).join('')}</div>
      <div class="step">${nodeName(e.from)} <b>→</b> ${nodeName(e.to)} <span class="mono">${esc(e.label)}</span></div><p>${esc(st.note || '')}</p>
      <div class="fact"><span class="small muted">edge</span><span>${esc(e.label)}</span>${verbs(s, 'edge:' + st.e)}</div>
      <p><button data-d="-1" ${i === 0 ? 'disabled' : ''}>← prev</button> <button data-d="1" ${i === f.steps.length - 1 ? 'disabled' : ''}>next →</button> <button data-flow="" title="leave the flow (Esc)">exit</button></p>`; }
  else if (s.focus) { const n = N[s.focus], ins = DATA.edges.filter(e => e.to === n.id), outs = DATA.edges.filter(e => e.from === n.id);
    const eRow = (e, other) => `<div class="fact"><span class="small muted">${e.from === n.id ? 'out' : 'in'}</span><span>${nodeName(other)} <span class="mono small">${esc(e.label)}</span></span>${verbs(s, 'edge:' + EK(e))}</div>`;
    body = `<div class="h">${esc(O[n.owner].label)}</div><div style="font-size:16px;font-weight:600">${esc(n.label)}</div><div class="muted">${esc(n.sub || '')}</div>
      <div class="h">facts</div>${(n.facts || []).map((x, j) => `<div class="fact">${pf(x.proof)}<span>${esc(x.k)}</span>${verbs(s, `node:${n.id}:${j}`)}</div>`).join('') || '<div class="empty">no facts recorded for this box</div>'}
      <div class="h">edges · ${ins.length} in, ${outs.length} out</div>${ins.map(e => eRow(e, e.from)).join('')}${outs.map(e => eRow(e, e.to)).join('')}
      <p><button data-focus="${n.id}" title="Esc">back to overview</button></p>`; }
  else body = `<div class="h">flows · walk one edge at a time</div>${DATA.flows.map(x => `<div class="fact"><span class="mono small">${x.steps.length}</span><span>${esc(x.name)}</span><button data-flow="${x.id}">walk →</button></div>`).join('')}
      <div class="h">proof marks</div>${Object.keys(DATA.proofs).map(p => `<div class="small" style="margin:3px 0">${pf(p)} ${esc(DATA.proofs[p])}</div>`).join('')}
      <p class="small muted">Click a box to see its facts and neighbours. Confirm or dispute any fact or edge; send to agent writes those verdicts.</p>`;
  $('#side').innerHTML = owners + body;
}

// ---- export ----
function verdicts(s) {
  return Object.entries(s.marks).map(([key, m]) => { const [kind, id, j] = key.split(':'), fact = kind === 'node' ? N[id].facts[+j] : null, e = kind === 'edge' ? E[id] : null;
    return { key, target: kind, node: kind === 'node' ? id : null, edge: e ? { from: e.from, to: e.to, label: e.label } : null, claim: fact ? fact.k : e.label, proof: fact ? fact.proof : null,
      verdict: m.v === 'ok' ? 'confirmed' : 'disputed', note: m.note || null }; });
}
function readback(items) {
  return items.map(it => ({ id: it.key, what: `${it.verdict}: ${it.node ? N[it.node].label + ' · ' : it.edge.from + ' → ' + it.edge.to + ' · '}${it.claim}`,
    found: it.node ? `box ${it.node} (${O[N[it.node].owner].label}), fact marked ${it.proof}` : `edge ${it.edge.from} → ${it.edge.to} "${it.edge.label}"`,
    next: it.verdict === 'disputed' ? `trace the claim to its source, correct it${it.note ? ' toward "' + it.note + '"' : ''}, and redraw; asks you before changing any source` : it.proof && it.proof !== 'proved' ? `record your confirmation as evidence beside the ${it.proof} mark; it stays ${it.proof} until a file or run proves it` : 'nothing; already proved',
    approval: it.verdict === 'disputed' })); }

// ---- wiring ----
const k = Kernel({ page: 'diagram', init, reduce, render, view: ['focus', 'flow', 'step', 'off'], verdicts, readback });
document.addEventListener('click', e => { if (e.target.closest('dialog')) return; const b = e.target.closest('[data-focus],[data-owner],[data-flow],[data-step],[data-d],[data-mark],[data-alloff]'); if (!b) return; const d = b.dataset;
  if (d.mark) k.fire({ type: 'mark', key: d.mark, v: d.v }); else if (d.owner) k.fire({ type: 'owner', id: d.owner });
  else if (d.flow != null) k.fire({ type: 'flow', id: d.flow || null }); else if (d.step) k.fire({ type: 'step', to: +d.step }); else if (d.d) k.fire({ type: 'step', d: +d.d });
  else if (d.alloff) offSet(k.state).forEach(id => k.fire({ type: 'owner', id })); else if (d.focus) k.fire({ type: 'focus', id: d.focus }); });
document.addEventListener('change', e => { if (e.target.dataset.key) k.fire({ type: 'note', key: e.target.dataset.key, note: e.target.value }); });
addEventListener('keydown', e => { if (/INPUT/.test(e.target.tagName) || $('#kmodal').open) return;
  if (k.state.flow && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) k.fire({ type: 'step', d: e.key === 'ArrowRight' ? 1 : -1 });
  if (e.key === 'Escape') k.state.flow ? k.fire({ type: 'flow', id: null }) : k.fire({ type: 'focus', id: null }); });
$('#send').onclick = () => k.exportVerdicts();

// ---- the walk ----
window.__walk = () => {
  const out = [], key = kk => new KeyboardEvent('keydown', { key: kk }); k.replay([]);
  out.push(assert($$('.node').length === DATA.nodes.length && $$('.edge').length === DATA.edges.length, 'every node and edge is drawn'));
  $('.node[data-focus="agent"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
  const hood = new Set(['agent', ...DATA.edges.flatMap(e => e.from === 'agent' ? [e.to] : e.to === 'agent' ? [e.from] : [])]);
  out.push(assert(k.state.focus === 'agent' && location.hash.includes('focus=agent') && $$('.node:not(.dim)').length === hood.size, `focus agent: ${hood.size} boxes in its neighbourhood, the rest dimmed`));
  $('[data-mark="node:agent:1"][data-v="wrong"]').click(); out.push(assert(k.state.marks['node:agent:1']?.v === 'wrong' && $('.node[data-focus="agent"] text:last-child').textContent === '✗1', 'dispute a fact: ✗ badge on the box'));
  $('[data-owner="host"]').click(); out.push(assert(!$('.node[data-focus="host"]') && location.hash.includes('off=host'), 'hide an owner: its boxes and edges leave the board'));
  $('[data-owner="host"]').click(); dispatchEvent(key('Escape')); out.push(assert(!k.state.focus, 'Esc backs out of focus'));
  $('[data-flow="approve"]').click(); const f = DATA.flows[0];
  out.push(assert($('.edge.hot')?.dataset.e === f.steps[0].e, 'walk a flow: step 1 edge is hot'));
  dispatchEvent(key('ArrowRight')); dispatchEvent(key('ArrowRight'));
  out.push(assert(k.state.step === '2' && $('.edge.hot').dataset.e === f.steps[2].e && $$('.edge.walked').length === 2 && location.hash.includes('step=2'), '→ → : step 3 hot, two walked, the URL carries it'));
  $('[data-d="-1"]').click(); out.push(assert(k.state.step === '1', '← prev steps back'));
  $('[data-mark^="edge:"][data-v="ok"]').click(); dispatchEvent(key('Escape')); out.push(assert(!k.state.flow && Object.keys(k.state.marks).length === 2, 'confirm an edge mid-flow; Esc leaves the flow'));
  const n = k.log.length; k.undo(); out.push(assert(k.log.length === n - 1 && k.state.flow === 'approve', 'undo returns into the flow'));
  const p = k.exportVerdicts(); $('#kmodal').close();
  out.push(assert(p.items.length === 2 && p.items.some(i => i.verdict === 'disputed') && $$('#kmodal .rb').length === 2, 'export: one confirmed, one disputed, a readback each'));
  k.replay([]); return out;
};
</script></body></html>
