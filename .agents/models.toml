# The one home of model guidance for the skill set.
# Skills and charters name tiers. This file names models, and the check fails on a model name anywhere else,
# so a new model is one edit here.
# Observations live in the skills ledger. This file keeps only the rates agents use.

updated = "2026-11-15"

# ---------------------------------------------------------------- tiers
# A tier is a kind of work. `model` is a key under [models].
# `effort` is the range to start in, low end first. Go above it one thread at a time, and say why in the brief.

[tiers.partner]
does = "a role that holds judgment over a run or a wave: root, implementor, purger"
model = "opus"
effort = ["default"]

[tiers.heady-writer]
does = "a writing thread on a new seam, a coupled decision, or other judgment-heavy code"
model = "fable"
effort = ["low", "medium"]

[tiers.slog-writer]
does = "a well-specified fix round, a rename, a mechanical sweep"
model = "sol"
effort = ["medium", "high"]

[tiers.census-reader]
does = "a read-only census or a mechanical read of a record"
model = "terra"
effort = ["default"]
alternate = "sonnet"

[tiers.taste]
does = "judgment that writes no code: design, UX and architecture opinion, a plan check, a scour; the one-shot scaffold of a step; never a fill thread"
model = "fable"
effort = ["medium"]

# ---------------------------------------------------------------- roles
# Each standing role runs on a tier.

[roles]
root = "partner"
implementor = "partner" # one per wave
purger = "partner"
driver = "slog-writer" # owner, 2026-11-15: below the pricing line; its drive children already ran on this tier
integrator = "slog-writer" # owner, 2026-11-15: below the pricing line; it ran on this model in kernel2 for the same cost as the partner tier in pod-pages

# Jobs that a role hands to children.
[jobs]
plan-check-reader = "taste"
tip-reviewer = "slog-writer"
mutant-runner = "slog-writer"
drive-child = "slog-writer" # the owner said this model drives as well
scour-reader = "taste" # untried on this tier

# ---------------------------------------------------------------- rates
# What an estimate line and a time box start from. Each comes from one run, named in brackets.
# The skills ledger holds the windows, sources and limits.

[rates]
estimate_ratio = "actual ran at a median near 0.25 of estimate, from branch start to first merge, over 31 estimates [kernel2]"
estimate_ratio_2 = "actual ran at a median near 0.2 of estimate, 0.1 to 0.4, over 7 wave-one estimates [pod-pages]"
estimate_lines = "a run planned as a convergence moved 48,430 production lines in 3.8 hours and grew by 15,396, with no line estimate to stop it [converge]"
estimate_unit = "all 8 estimates ran high, by 1.1 to 6 times in hours and 4 to 16 times in days, so estimate in hours [homes]"
heady_writer_slice = "0.6 to 5.2 active hours, median 1.6; about 400 added lines per writer-hour [homes]"
slog_writer_fix_round = "6 to 12 active minutes [homes]"
full_suite = "26 to 34 minutes on a merged tip [homes]"
merge_to_build = "43 minutes at the median [kernel2]"
driver_tip_to_rows = "42 minutes at the median, 14 to 71 [homes]"

# ---------------------------------------------------------------- models
# `names` are the words the check bans from skills and charters.
# `meter` is the scope `meter.py` reports for this model.
# `rules` bind this model only. A rule that binds every model belongs in `delegate`.

[models.opus]
names = ["Opus"]
id = "claude-opus-5-5"
provider = "claude"
meter = "weekly_all"
rules = [
  "Never runs a writer tier. A partner on this model sends every slice and fix round to a child on a writer tier, even when the heady writer's meter is empty (owner, 2026-11-12). What it writes itself is what its charter names: a merge, a merge fix, an assigned seam, and for the integrator the fix of a red that is main's own or that its merge made.",
  "May be messaged at any idle age: a cold restart of a re-woken partner is cheap.",
]

[models.fable]
names = ["Fable"]
id = "claude-fable-5-2"
provider = "claude"
meter = "weekly_scoped:Fable"
rules = [
  "Start at medium effort or lower. High is for judgment-heavy integrity work, and the brief says why (owner, 2026-11-11).",
  "Do not message a medium or high effort thread that has been idle for an hour. Start a fresh thread with a full brief (owner, 2026-11-12).",
  "An agent cannot redeem this model's banked resets. Only the owner can.",
]

[models.sol]
names = ["Sol"]
id = "gpt-6.1-sol"
provider = "codex"
meter = "codex"
rules = [
  "Rewrite its agent-to-agent messages before forwarding them: it runs words together in 18% of them and in 0% of replies to the owner (docs/research/2026-11-09-garble-by-model.md).",
  "May be messaged at any idle age.",
  "Do not substitute an older model of this family or an older Codex default.",
]

[models.terra]
names = ["Terra"]
id = "gpt-6.1-terra"
provider = "codex"
meter = "codex"
rules = [
  "Give it one file set and one table per task, because two censuses that spanned a dozen files stopped incomplete (2026-11-12).",
]

[models.sonnet]
names = ["Sonnet"]
id = "claude-sonnet-5-5"
provider = "claude"
meter = "weekly_all"
rules = []

[models.astra]
names = ["Astra"]
id = "gpt-6-astra"
provider = "codex"
meter = "codex"
banned = true
rules = ["Owner ban: never used."]

# ---------------------------------------------------------------- owner
# Facts no meter reports. kaitpw edits these. An agent reads them and never changes them.

[owner]
claude_banked_resets = "some; count not stated (2026-11-12)"
codex_reset_credits = 0
codex_usage_credits = "62,500 stated on 2026-11-12; whether they draw past an empty meter is unconfirmed"
