# The one home of model guidance for the skill set.
# Skills and charters name tiers. This file names models.
# `python .agents/skills/check.py` fails when a word under a model's `names`, or a model id,
# appears in a SKILL.md or a role charter. A new model is one edit here.
# Every observation carries a date, an N and its limits. Delete an observation a newer one replaces.

updated = "2026-11-14"

# ---------------------------------------------------------------- tiers
# A tier is a kind of work. `model` is a key under [models].
# `effort` is the range to start in, low end first. Go above it one thread at a time, and say why in the brief.

[tiers.partner]
does = "a standing role that is woken many times over a run: implementor, purger, driver, integrator"
model = "opus"
effort = ["default"]

[tiers.heady-writer]
does = "a writing thread on a new seam, a coupled decision, or other judgment-heavy code"
model = "fable"
effort = ["low", "medium"]

[tiers.slog-writer]
does = "a well-specified fix round, a rename, a mechanical sweep"
model = "sol"
effort = ["medium", "high"]

[tiers.census-reader]
does = "a read-only census or a mechanical read of a record"
model = "terra"
effort = ["default"]
alternate = "sonnet"

[tiers.taste]
does = "judgment that writes no code: design, UX and architecture opinion, a plan check, a scour; the one-shot scaffold of a step; never a fill thread"
model = "fable"
effort = ["medium"]

# ---------------------------------------------------------------- roles
# A charter names no model. Each standing role runs on a tier.

[roles]
implementor = "partner"
purger = "partner"
driver = "partner"
integrator = "partner" # its work is mechanical; a cheaper tier passed a cold read and no run (see observations)

# Jobs that a role hands to children.
[jobs]
plan-check-reader = "taste" # homes: four readers, three minutes, four plan changes
tip-reviewer = "slog-writer" # kernel2: the purger's 12 children were 10 on this tier's model and 2 on the taste tier's
mutant-runner = "slog-writer"
drive-child = "slog-writer" # kernel2: all 7 of the driver's children, after the owner said this model drives as well
wave-lead = "heady-writer" # untried: it writes no code, and it needs the judgment to send a report back
tail-lead = "heady-writer" # untried
scour-reader = "taste" # untried on this tier; on 2026-11-12 two readers on the partner tier's model took 8 and 9 minutes for 37 anchored findings

# ---------------------------------------------------------------- models
# `names` are the words the check bans from skills and charters.
# `meter` is the scope `meter.py` reports for this model.
# `rules` bind this model only. A rule that binds every model belongs in `delegate`.

[models.opus]
names = ["Opus"]
id = "claude-opus-5-5"
provider = "claude"
meter = "weekly_all"
rules = [
  "Never runs a writer tier. A partner on this model sends every slice and fix round to a child on a writer tier, even when the heady writer's meter is empty (owner, 2026-11-12). What it writes itself is what its charter names: a merge, a merge fix, an assigned seam, and for the integrator the fix of a red that is main's own or that its merge made.",
  "May be messaged at any idle age: a cold restart of a re-woken partner is cheap (see observations).",
]

[models.fable]
names = ["Fable"]
id = "claude-fable-5-2"
provider = "claude"
meter = "weekly_scoped:Fable"
rules = [
  "Start at medium effort or lower. High is for judgment-heavy integrity work, and the brief says why (owner, 2026-11-11).",
  "Do not message a medium or high effort thread that has been idle for an hour. Start a fresh thread with a full brief (owner, 2026-11-12).",
  "An agent cannot redeem this model's banked resets. Only the owner can.",
]

[models.sol]
names = ["Sol"]
id = "gpt-6.1-sol"
provider = "codex"
meter = "codex"
rules = [
  "Rewrite its agent-to-agent messages before forwarding them: it runs words together in 18% of them and in 0% of replies to the owner (docs/research/2026-11-09-garble-by-model.md).",
  "May be messaged at any idle age.",
  "Do not substitute an older model of this family or an older Codex default.",
]

[models.terra]
names = ["Terra"]
id = "gpt-6.1-terra"
provider = "codex"
meter = "codex"
rules = [
  "Give it one file set and one table per task. Two censuses that spanned a dozen files stopped incomplete, at medium and at high effort (2026-11-12).",
]

[models.sonnet]
names = ["Sonnet"]
id = "claude-sonnet-5-5"
provider = "claude"
meter = "weekly_all"
rules = []

[models.haiku]
names = ["Haiku"]
id = "claude-haiku-5-5"
provider = "claude"
meter = "weekly_all"
rules = ["Runs the keepalive tick and nothing that needs judgment."]

[models.astra]
names = ["Astra"]
id = "gpt-6-astra"
provider = "codex"
meter = "codex"
banned = true
rules = ["Owner ban: never used."]

# ---------------------------------------------------------------- owner
# Facts no meter reports. kaitpw edits these. An agent reads them and never changes them.

[owner]
claude_banked_resets = "some; count not stated (2026-11-12)"
codex_reset_credits = 0
codex_usage_credits = "62,500 stated on 2026-11-12; whether they draw past an empty meter is unconfirmed"

