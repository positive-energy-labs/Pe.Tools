<!doctype html>
<html lang="en" data-pe>
<head>
<meta charset="utf-8">

<link rel="icon" href="data:,">

<style>
body { margin: 0; }
main { max-width: 1280px; margin: auto; padding: 32px; }
.mast, .heading, .summary, .section-head, .foot { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.mast { border-bottom: 1px solid var(--pe-line-2); padding-bottom: 12px; }
.eyebrow { font-size: var(--type-small-size); letter-spacing: var(--track-upper); text-transform: uppercase; color: var(--pe-ink-2); }
.heading { margin: 32px 0 24px; }
h1 { font: var(--weight-medium) var(--type-display-size)/var(--type-display-line-height) var(--font-display); margin: 0 0 8px; }
h2 { font-size: var(--type-title-size); font-weight: var(--weight-strong); margin: 0; }
p { margin: 0; }
.muted { color: var(--pe-ink-2); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.workspace { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: 24px; margin-top: 28px; }
.workspace > *, .fields > * { min-width: 0; }
.section-head { margin-bottom: 12px; }
.summary { padding: 20px 0; border-top: 1px solid var(--pe-line-2); border-bottom: 1px solid var(--pe-line-2); margin-bottom: 20px; }
.metric { font: var(--weight-regular) var(--type-display-size)/var(--type-display-line-height) var(--font-mono); margin-top: 6px; }
.unit { font-size: var(--type-title-size); color: var(--pe-ink-2); margin-left: 4px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
.field { display: grid; gap: 6px; }
.field:first-child { grid-column: 1 / -1; }
.artifact-body { min-height: 280px; }
.artifact-body > .dl-code-frame { border: 0; }
.notes { padding: 16px 20px; border-top: 1px solid var(--pe-line); }
.diagram { margin-top: 24px; }
.foot { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--pe-line-2); }
.comparison { min-height: 300px; }
.comparison [data-slot="table"] { min-height: 0; }
.result-note { margin-top: 8px; }
table[aria-label="Electrical circuits"] { min-width: 1200px; }
table[aria-label="Electrical circuits"] td { padding-inline: 8px; }
.error { padding: 20px 0; color: var(--pe-alarm); }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.target { display: flex; gap: 12px; align-items: center; margin: 20px 0; }
.target input { width: 100px; }
.proposal { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 24px; }
.proposal > * { min-width: 0; }
.capture { margin: 24px 0; }
.capture img { display: block; max-height: 560px; width: 100%; object-fit: contain; background: white; }
.capture figcaption { margin-top: 8px; }
@media (max-width: 1000px) { main { padding: 24px; } .workspace { grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr); gap: 16px; } .metric { font-size: var(--type-head-size); } }
@media (max-width: 720px) { main { padding: 16px; } .workspace { grid-template-columns: 1fr; } .heading, .foot { align-items: flex-start; flex-direction: column; } .mast { flex-wrap: wrap; } }
</style>
</head>

<script id="page-source" type="application/json">{"calc":"// Copper K method at 75 C, unity power factor, negligible reactance.\n// Formula and circular-mil areas: IAEI, Voltage Drop Formulas (March 2017).\nexport const sizes = [\n  [\"14\", 4110], [\"12\", 6530], [\"10\", 10380], [\"8\", 16510], [\"6\", 26240],\n  [\"4\", 41740], [\"3\", 52620], [\"2\", 66360], [\"1\", 83690], [\"1/0\", 105600],\n].map(([size, area]) => ({ size, area }));\n\nexport function calculate({ size, length, amps, voltage, phase }) {\n  const conductor = sizes.find((row) => row.size === size);\n  if (!conductor || ![\"1\", \"3\"].includes(phase)) throw new Error(\"Choose a conductor and phase.\");\n  if (![length, amps, voltage].every((n) => typeof n === \"number\" && Number.isFinite(n)) || length < 0 || amps < 0 || voltage <= 0)\n    throw new Error(\"Enter a nonnegative length and load, and a voltage greater than zero.\");\n  const multiplier = phase === \"1\" ? 2 : Math.sqrt(3);\n  const drop = multiplier * 12.9 * amps * length / conductor.area;\n  return { drop, percent: 100 * drop / voltage, delivered: voltage - drop, area: conductor.area, multiplier };\n}\n","circuits":"import { calculate, sizes } from \"./calc.mjs\";\n\nexport const SCHEMA_VERSION = 1;\nexport const initialCircuitState = { v: SCHEMA_VERSION, reading: null, selectedId: null, overrides: {}, inputs: { size: \"10\", length: \"150\", amps: \"24\", voltage: \"208\", phase: \"3\", material: \"Copper\" }, target: \"3\", tab: \"inputs\", theme: \"system\", proposal: null, receipt: null };\nconst finite = value => typeof value === \"number\" && Number.isFinite(value) ? value : null;\nconst text = value => value == null ? \"\" : String(value);\nconst knownSize = value => {\n  const raw = text(value).trim();\n  if (sizes.some(row => row.size === raw)) return raw;\n  if (/sets?|parallel|kcmil|\\d\\s*\\/\\s*\\d/i.test(raw.replace(/\\b1\\/0\\b/g, \"\"))) return null;\n  // Every conductor token must be supported. A ground wire must never stand in for an unsupported hot wire.\n  const tokens = [...raw.matchAll(/#\\s*(\\d+(?:\\/0)?)/g)].map(match => match[1]);\n  if (!tokens.length || tokens.some(token => !sizes.some(row => row.size === token))) return null;\n  const match = raw.match(/#\\s*(14|12|10|8|6|4|3|2|1\\/0|1)\\b/);\n  if (!match) return null;\n  const all = [...raw.matchAll(/#\\s*(14|12|10|8|6|4|3|2|1\\/0|1)\\b/g)].map(m => m[1]);\n  return new Set(all).size === 1 ? match[1] : null;\n};\n\nexport function adaptCircuits(catalog, values) {\n  if (values.v !== SCHEMA_VERSION) throw new Error(\"Unsupported circuit reading version.\");\n  const measurements = new Map(values.rows.map(row => [row.circuitId, row]));\n  return catalog.entries.map(entry => {\n    const measured = measurements.get(entry.circuitId);\n    return {\n      id: entry.circuitId, uniqueId: entry.circuitUniqueId, panel: entry.panelName || \"Unassigned\", number: entry.circuitNumber,\n      load: entry.loadName || \"Unnamed load\", poles: entry.polesNumber,\n      amps: finite(measured?.amps), voltage: finite(measured?.voltage), length: finite(measured?.length),\n      wireSize: measured?.wireSize ?? entry.wireSize ?? null, size: measured ? knownSize(measured.wireSize) : null,\n      material: measured?.material ?? null, phase: [1, 2].includes(entry.polesNumber) ? \"1\" : entry.polesNumber === 3 ? \"3\" : null,\n      elementIds: [...new Set([...(entry.connectedElements || []).map(e => e.elementId), ...(entry.wires || []).map(w => w.wireId)])],\n      wireParameter: measured?.wireParameter ?? null, unavailable: measured?.unavailable ?? [\"Numeric circuit facts unavailable\"],\n    };\n  });\n}\n\nexport function circuitCalculation(row, overrides = {}, target = 3) {\n  const input = { size: row.size, length: row.length, amps: row.amps, voltage: row.voltage, phase: row.phase, material: row.material, ...overrides };\n  const missing = [];\n  for (const key of [\"length\", \"amps\", \"voltage\"]) {\n    if (input[key] === null || text(input[key]).trim() === \"\") missing.push(key);\n    else input[key] = Number(input[key]);\n  }\n  if (!input.size) missing.push(\"conductor size\");\n  if (!input.phase) missing.push(\"phase\");\n  if (!/^copper|^cu$/i.test(input.material || \"\")) missing.push(\"copper material confirmation\");\n  if (missing.length) return { status: \"unavailable\", reason: `Override required: ${missing.join(\", \")}.`, input };\n  try {\n    const result = calculate(input);\n    if (!Number.isFinite(Number(target)) || Number(target) <= 0) throw new Error(\"Enter a design target greater than zero.\");\n    return { status: result.percent > Number(target) ? \"above\" : \"within\", input, ...result };\n  } catch (error) { return { status: \"unavailable\", reason: error.message, input }; }\n}\n\nexport function circuitReduce(state, event) {\n  if (event.v !== SCHEMA_VERSION) return state;\n  switch (event.type) {\n    case \"reading\": {\n      const before = state.reading?.document, after = event.reading.document;\n      const sameDocument = before?.session === after?.session && before?.openId === after?.openId;\n      return { ...state, reading: event.reading, selectedId: sameDocument && event.reading.rows.some(row => row.id === state.selectedId) ? state.selectedId : null, overrides: sameDocument ? state.overrides : {}, proposal: null, receipt: null };\n    }\n    case \"select\": return { ...state, selectedId: event.id, proposal: null, receipt: null };\n    case \"override\": return { ...state, overrides: { ...state.overrides, [state.selectedId]: { ...state.overrides[state.selectedId], [event.key]: event.value } }, proposal: null };\n    case \"set\": return [\"target\", \"tab\", \"theme\"].includes(event.key) ? { ...state, [event.key]: event.value, proposal: event.key === \"target\" ? null : state.proposal } : state;\n    case \"input\": return Object.hasOwn(state.inputs, event.key) ? { ...state, inputs: { ...state.inputs, [event.key]: event.value } } : state;\n    case \"proposal\": return { ...state, proposal: event.proposal, receipt: null };\n    case \"receipt\": return { ...state, receipt: event.receipt, proposal: null };\n    case \"clear-overrides\": return { ...state, overrides: { ...state.overrides, [state.selectedId]: {} }, proposal: null };\n    default: return state;\n  }\n}\n\nexport function wireProposal(row, size, evidence) {\n  if (!evidence || evidence.elementId !== row.id || !Number.isInteger(evidence.parameterId)) throw new Error(\"Exact wire parameter evidence is required.\");\n  if (!sizes.some(item => item.size === size)) throw new Error(\"Choose a supported conductor size.\");\n  if (evidence.isReadOnly) return { key: \"revit.apply.parameter-values\", circuitId: row.id, size, before: evidence.rawValue, evidence, input: null, blocked: \"Revit's Wire Size parameter is read-only. This conductor choice is a calculation override; Revit must size the circuit through its electrical settings.\" };\n  if (evidence.storageType !== \"String\") throw new Error(\"This wire parameter does not accept an AWG string.\");\n  return { key: \"revit.apply.parameter-values\", circuitId: row.id, size, before: evidence.rawValue, input: { dryRun: false, transactionName: \"Page: approved circuit conductor change\", edits: [{ elementId: row.id, parameterId: evidence.parameterId, value: size, expected: evidence }] } };\n}\n","app":"﻿/* Ordinary JavaScript consumer of the same instruments as the app. */\n(async () => {\nawait pe.kitReady;\nconst { h, createRoot, useEffect, useState, ArtifactFrame, PaneTabs, Picker, Input, Table, Code, Mermaid, Button } = pe.kit;\nconst offline = !pe.target;\nconst sources = JSON.parse(document.getElementById('page-source').textContent);\nconst base = pe.exported?.snapshot?.v === SCHEMA_VERSION ? pe.exported.snapshot : structuredClone(initialCircuitState);\nconst params = new URLSearchParams(location.hash.slice(1));\nfor (const key of ['tab', 'theme', 'target']) if (params.has(key)) base[key] = params.get(key);\nlet redraw = () => {};\nconst kernel = pe.kernel(circuitReduce, base, () => redraw(kernel.state));\nconst fire = event => kernel.fire({ ...event, v: SCHEMA_VERSION });\nconst fmt = value => value == null ? 'Unavailable' : Number(value).toFixed(2);\nconst when = at => at ? new Date(at).toLocaleString() : 'No reading yet';\nconst tabs = ['inputs', 'trace', 'source'].map(value => ({ value, label: { inputs: 'Inputs', trace: 'Calc trace', source: 'Source' }[value], title: 'Show ' + value }));\n\nfunction Page() {\n  const [state, setState] = useState(kernel.state);\n  const [busy, setBusy] = useState('');\n  const [error, setError] = useState('');\n  const [bound, setBound] = useState(null);\n  const [filter, setFilter] = useState('');\n  const [inspection, setInspection] = useState(null);\n  const [picture, setPicture] = useState(null);\n  redraw = setState;\n  const rows = state.reading?.rows || [];\n  const visible = rows.filter(row => [row.panel, row.number, row.load, row.id].join(' ').toLowerCase().includes(filter.toLowerCase()));\n  const counts = rows.reduce((counts, row) => { const status = circuitCalculation(row, state.overrides[row.id], state.target).status; counts[status]++; return counts; }, { above: 0, within: 0, unavailable: 0 });\n  const selected = rows.find(row => row.id === state.selectedId);\n  const overrides = state.overrides[state.selectedId] || {};\n  const result = circuitCalculation(selected || { ...state.inputs }, selected ? overrides : {}, state.target);\n  const input = result.input;\n  const set = (key, value) => fire({ type: 'set', key, value });\n  const act = async (label, run) => {\n    setBusy(label); setError('');\n    try { await run(); } catch (e) { setError(e.message); } finally { setBusy(''); }\n  };\n  const assertTarget = async () => {\n    const target = await pe.target(); setBound(target);\n    const read = kernel.state.reading?.document;\n    if (!read || read.session !== target.session || read.openId !== target.openId) throw new Error('The binding changed since this circuit reading. Read circuits again before acting.');\n    return target;\n  };\n  const refresh = async () => {\n    const target = await pe.target(); setBound(target);\n    const catalog = await pe.read('revit.catalog.electrical-circuits', {});\n    const response = await pe.do('script:@snowdon-circuits/src/Census.cs', { permissionMode: 'ReadOnly', timeoutSeconds: 60 });\n    if (response?.status !== 'Succeeded') throw new Error('Circuit census ' + (response?.status || 'returned no result') + ': ' + (response?.diagnostics || []).map(d => d.message).join('; '));\n    const values = response.data;\n    if (!values || values.error) throw new Error(values?.error || 'Circuit census returned no data.');\n    const current = await pe.target();\n    if (current.session !== target.session || current.openId !== target.openId) throw new Error('The binding changed during the reading. Read circuits again.');\n    fire({ type: 'reading', reading: { v: SCHEMA_VERSION, source: 'revit.catalog.electrical-circuits + script:@snowdon-circuits/src/Census.cs', at: Date.now(), document: target, copyOnly: values.copyOnly, total: values.total, rows: adaptCircuits(catalog, values), issues: catalog.issues || [] } });\n  };\n  const assertCopy = async () => {\n    const target = await assertTarget();\n    if (!/copy|sandbox/i.test(target.title || '') || kernel.state.reading?.copyOnly !== true) throw new Error('Wire changes are refused outside a disposable copy. Open a model whose title includes copy or sandbox, bind it, then read circuits.');\n  };\n  const show = async row => {\n    await assertTarget();\n    if (!row.elementIds.length) throw new Error('This circuit has no connected load or wire elements to show.');\n    const lens = await pe.do('revit.context.lens', { elementIds: row.elementIds });\n    await pe.do('revit.context.show-elements', { elementIds: row.elementIds, viewId: lens.viewId });\n  };\n  const select = row => {\n    fire({ type: 'select', id: row.id });\n    setPicture(null); setInspection(null); window.pageCapture = null;\n    if (!offline && row.elementIds.length) act('Highlighting circuit', async () => {\n      await show(row);\n    });\n  };\n  const prepare = () => act('Reading wire evidence', async () => {\n    await assertCopy();\n    if (!selected.wireParameter) throw new Error('The circuit has no Wire Size parameter. The override changes this calculation only.');\n    const answer = await pe.do('revit.apply.parameter-values', { dryRun: true, edits: [{ elementId: selected.id, parameterId: selected.wireParameter.parameterId, value: input.size }] });\n    const evidence = answer.results?.[0]?.current;\n    if (!evidence) throw new Error(answer.results?.[0]?.error || 'Revit did not return exact wire evidence.');\n    fire({ type: 'proposal', proposal: wireProposal(selected, input.size, evidence) });\n  });\n  const approve = () => act('Applying approved wire change', async () => {\n    const proposal = kernel.state.proposal;\n    await assertCopy();\n    if (!proposal || proposal.circuitId !== kernel.state.selectedId) throw new Error('Prepare the selected circuit proposal again.');\n    if (proposal.blocked || !proposal.input) throw new Error(proposal.blocked || 'This proposal has no executable change.');\n    const receipt = await pe.do(proposal.key, proposal.input);\n    if (receipt.applied !== 1) throw new Error(receipt.results?.[0]?.error || 'Revit did not apply the conductor change.');\n    await refresh();\n    fire({ type: 'receipt', receipt: { at: Date.now(), ...receipt } });\n  });\n  const inspect = () => act('Inspecting selected circuit', async () => {\n    await show(selected);\n    const response = await pe.do('script:@snowdon-circuits/src/InspectRun.cs', { permissionMode: 'ReadOnly', timeoutSeconds: 60 });\n    if (response?.status !== 'Succeeded') throw new Error('Inspect circuit ' + (response?.status || 'returned no result'));\n    setInspection({ source: 'script:@snowdon-circuits/src/InspectRun.cs', at: Date.now(), rows: response.data });\n    set('tab', 'trace');\n  });\n  const capture = () => act('Capturing selected circuit', async () => {\n    await assertTarget();\n    const lens = await pe.do('revit.context.lens', { elementIds: selected.elementIds, paddingFeet: 8 });\n    // Export the padded lens as configured. Focus would crop the tiny load again and lose its context.\n    const response = await pe.read('revit.context.view-image', { target: { id: lens.viewId }, pixelSize: 2000 });\n    const url = response.captureUrl || response.imageUrl;\n    if (!url) throw new Error('The circuit lens image was not kept by the host.');\n    const image = { url, sha: (url.match(/([a-f0-9]{64})/i) || [])[1] || null, at: Date.now(), viewId: lens.viewId, viewName: lens.viewName, registration: response.registration || null };\n    const current = await pe.target();\n    const read = kernel.state.reading.document;\n    if (current.session !== read.session || current.openId !== read.openId) throw new Error('The binding changed while capturing. Capture the circuit again.');\n    const captured = { ...image, document: read, circuitId: selected.id, panel: selected.panel, number: selected.number };\n    setPicture(captured); window.pageCapture = captured;\n  });\n  const exportPage = () => act('Exporting snapshot', async () => {\n    const response = await pe.fetch('/pages/' + encodeURIComponent(pe.slug) + '/export', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ snapshot: kernel.state }) });\n    if (!response.ok) throw new Error(await response.text());\n    const url = URL.createObjectURL(await response.blob());\n    const a = document.createElement('a'); a.href = url; a.download = 'voltage-drop-snapshot.html'; a.click();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  });\n  useEffect(() => {\n    pe.describe(() => '# Voltage drop\\n\\nDocument: ' + (kernel.state.reading?.document?.title || 'Manual calculation') + '\\nRead at: ' + when(kernel.state.reading?.at) + '\\nTarget: ' + kernel.state.target + '%\\n\\n' + JSON.stringify(kernel.state, null, 2));\n    pe.state(kernel, { local: ['select', 'set', 'proposal', 'receipt', 'input'] }).then(() => setState(kernel.state)).catch(e => setError(e.message));\n    if (!offline) pe.target().then(setBound).catch(e => setError(e.message));\n  }, []);\n  useEffect(() => {\n    document.documentElement.dataset.theme = state.theme;\n    document.documentElement.classList.toggle('dark', state.theme === 'dark');\n    history.replaceState(null, '', location.pathname + location.search + '#' + new URLSearchParams({ tab: state.tab, theme: state.theme, target: state.target }));\n    window.pageState = { state, events: kernel.log };\n  }, [state]);\n  const change = (key, value) => fire({ type: selected ? 'override' : 'input', key, value });\n  const pick = (key, label, options) => h('div', { className: 'field', key }, h('span', { className: 'muted' }, label), h(Picker, {\n    anchor: 'trigger', face: 'field', triggerLabel: label, trigger: options.find(o => o.value === input[key])?.label ?? 'Unavailable · choose override', 'aria-label': label,\n    items: options, keyOf: o => o.value, labelOf: o => o.label, filter: 'substring', empty: 'No options', selected: input[key] ? [input[key]] : [], select: 'single', onPick: o => change(key, o.value), row: o => ({ label: o.label }),\n  }));\n  const field = (key, label) => h('label', { className: 'field', key }, h('span', { className: 'muted' }, label), h(Input, { 'aria-label': label, placeholder: 'Unavailable · enter override', type: 'number', min: 0, step: 'any', value: input[key] ?? '', face: 'mono', onChange: event => change(key, event.target.value) }));\n  const num = (row, key) => h('span', { className: 'mono' }, fmt(row[key]));\n  const circuitColumns = [\n    { key: 'panel', label: 'Panel', cell: row => h(Button, { label: 'Select ' + row.panel + ' circuit ' + row.num <script>// Copper K method at 75 C, unity power factor, negligible reactance.
// Formula and circular-mil areas: IAEI, Voltage Drop Formulas (March 2017).
const sizes = [
  ["14", 4110], ["12", 6530], ["10", 10380], ["8", 16510], ["6", 26240],
  ["4", 41740], ["3", 52620], ["2", 66360], ["1", 83690], ["1/0", 105600],
].map(([size, area]) => ({ size, area }));

function calculate({ size, length, amps, voltage, phase }) {
  const conductor = sizes.find((row) => row.size === size);
  if (!conductor || !["1", "3"].includes(phase)) throw new Error("Choose a conductor and phase.");
  if (![length, amps, voltage].every((n) => typeof n === "number" && Number.isFinite(n)) || length < 0 || amps < 0 || voltage <= 0)
    throw new Error("Enter a nonnegative length and load, and a voltage greater than zero.");
  const multiplier = phase === "1" ? 2 : Math.sqrt(3);
  const drop = multiplier * 12.9 * amps * length / conductor.area;
  return { drop, percent: 100 * drop / voltage, delivered: voltage - drop, area: conductor.area, multiplier };
}


const SCHEMA_VERSION = 1;
const initialCircuitState = { v: SCHEMA_VERSION, reading: null, selectedId: null, overrides: {}, inputs: { size: "10", length: "150", amps: "24", voltage: "208", phase: "3", material: "Copper" }, target: "3", tab: "inputs", theme: "system", proposal: null, receipt: null };
const finite = value => typeof value === "number" && Number.isFinite(value) ? value : null;
const text = value => value == null ? "" : String(value);
const knownSize = value => {
  const raw = text(value).trim();
  if (sizes.some(row => row.size === raw)) return raw;
  if (/sets?|parallel|kcmil|\d\s*\/\s*\d/i.test(raw.replace(/\b1\/0\b/g, ""))) return null;
  // Every conductor token must be supported. A ground wire must never stand in for an unsupported hot wire.
  const tokens = [...raw.matchAll(/#\s*(\d+(?:\/0)?)/g)].map(match => match[1]);
  if (!tokens.length || tokens.some(token => !sizes.some(row => row.size === token))) return null;
  const match = raw.match(/#\s*(14|12|10|8|6|4|3|2|1\/0|1)\b/);
  if (!match) return null;
  const all = [...raw.matchAll(/#\s*(14|12|10|8|6|4|3|2|1\/0|1)\b/g)].map(m => m[1]);
  return new Set(all).size === 1 ? match[1] : null;
};

function adaptCircuits(catalog, values) {
  if (values.v !== SCHEMA_VERSION) throw new Error("Unsupported circuit reading version.");
  const measurements = new Map(values.rows.map(row => [row.circuitId, row]));
  return catalog.entries.map(entry => {
    const measured = measurements.get(entry.circuitId);
    return {
      id: entry.circuitId, uniqueId: entry.circuitUniqueId, panel: entry.panelName || "Unassigned", number: entry.circuitNumber,
      load: entry.loadName || "Unnamed load", poles: entry.polesNumber,
      amps: finite(measured?.amps), voltage: finite(measured?.voltage), length: finite(measured?.length),
      wireSize: measured?.wireSize ?? entry.wireSize ?? null, size: measured ? knownSize(measured.wireSize) : null,
      material: measured?.material ?? null, phase: [1, 2].includes(entry.polesNumber) ? "1" : entry.polesNumber === 3 ? "3" : null,
      elementIds: [...new Set([...(entry.connectedElements || []).map(e => e.elementId), ...(entry.wires || []).map(w => w.wireId)])],
      wireParameter: measured?.wireParameter ?? null, unavailable: measured?.unavailable ?? ["Numeric circuit facts unavailable"],
    };
  });
}

function circuitCalculation(row, overrides = {}, target = 3) {
  const input = { size: row.size, length: row.length, amps: row.amps, voltage: row.voltage, phase: row.phase, material: row.material, ...overrides };
  const missing = [];
  for (const key of ["length", "amps", "voltage"]) {
    if (input[key] === null || text(input[key]).trim() === "") missing.push(key);
    else input[key] = Number(input[key]);
  }
  if (!input.size) missing.push("conductor size");
  if (!input.phase) missing.push("phase");
  if (!/^copper|^cu$/i.test(input.material || "")) missing.push("copper material confirmation");
  if (missing.length) return { status: "unavailable", reason: `Override required: ${missing.join(", ")}.`, input };
  try {
    const result = calculate(input);
    if (!Number.isFinite(Number(target)) || Number(target) <= 0) throw new Error("Enter a design target greater than zero.");
    return { status: result.percent > Number(target) ? "above" : "within", input, ...result };
  } catch (error) { return { status: "unavailable", reason: error.message, input }; }
}

function circuitReduce(state, event) {
  if (event.v !== SCHEMA_VERSION) return state;
  switch (event.type) {
    case "reading": {
      const before = state.reading?.document, after = event.reading.document;
      const sameDocument = before?.session === after?.session && before?.openId === after?.openId;
      return { ...state, reading: event.reading, selectedId: sameDocument && event.reading.rows.some(row => row.id === state.selectedId) ? state.selectedId : null, overrides: sameDocument ? state.overrides : {}, proposal: null, receipt: null };
    }
    case "select": return { ...state, selectedId: event.id, proposal: null, receipt: null };
    case "override": return { ...state, overrides: { ...state.overrides, [state.selectedId]: { ...state.overrides[state.selectedId], [event.key]: event.value } }, proposal: null };
    case "set": return ["target", "tab", "theme"].includes(event.key) ? { ...state, [event.key]: event.value, proposal: event.key === "target" ? null : state.proposal } : state;
    case "input": return Object.hasOwn(state.inputs, event.key) ? { ...state, inputs: { ...state.inputs, [event.key]: event.value } } : state;
    case "proposal": return { ...state, proposal: event.proposal, receipt: null };
    case "receipt": return { ...state, receipt: event.receipt, proposal: null };
    case "clear-overrides": return { ...state, overrides: { ...state.overrides, [state.selectedId]: {} }, proposal: null };
    default: return state;
  }
}

function wireProposal(row, size, evidence) {
  if (!evidence || evidence.elementId !== row.id || !Number.isInteger(evidence.parameterId)) throw new Error("Exact wire parameter evidence is required.");
  if (!sizes.some(item => item.size === size)) throw new Error("Choose a supported conductor size.");
  if (evidence.isReadOnly) return { key: "revit.apply.parameter-values", circuitId: row.id, size, before: evidence.rawValue, evidence, input: null, blocked: "Revit's Wire Size parameter is read-only. This conductor choice is a calculation override; Revit must size the circuit through its electrical settings." };
  if (evidence.storageType !== "String") throw new Error("This wire parameter does not accept an AWG string.");
  return { key: "revit.apply.parameter-values", circuitId: row.id, size, before: evidence.rawValue, input: { dryRun: false, transactionName: "Page: approved circuit conductor change", edits: [{ elementId: row.id, parameterId: evidence.parameterId, value: size, expected: evidence }] } };
}

(async () => {

for (const key of ['tab', 'theme', 'target']) if (params.has(key)) base[key] = params.get(key);
let redraw = () => {};
