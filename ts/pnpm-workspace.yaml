packages:
  - apps/*
  - packages/*
  - tests/*
  - tools/*
  - ../examples/pods/snowdon-circuits
  - ../examples/pods/hydronic

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.6.0
  beautiful-mermaid: 1.1.3
  "@tanstack/highlight": 0.0.10
  "@tanstack/react-hotkeys": ^0.10.0
  "@tanstack/react-virtual": ^3.14.22
  ajv: ^8.20.0
  json-schema-to-typescript: ^15.0.4
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1
  vite-plus: 0.2.1
  knip: ^6.37.0
  zod: 4.3.6
  "@agentclientprotocol/sdk": 1.5.1
  "@agentclientprotocol/claude-agent-acp": 0.84.0
  "@agentclientprotocol/codex-acp": 2.1.0
  "@modelcontextprotocol/client": 2.4.0
  "@modelcontextprotocol/server": 2.4.0
  react-grab: ^0.2.0
  modern-screenshot: ^4.7.0
  qrcode: ^1.5.4
  "@types/qrcode": ^1.5.6
  mermaid: ^12.2.0
  three: ^0.186.1
  "@types/three": ^0.186.0
  "@types/node": ^25.9.2
  typescript: ^6.0.3
  '@testing-library/user-event': 14.6.1
overrides:
  vite: "catalog:"
  "@smithy/core": 3.33.3
  # platform-node 4.0.2 floats to shared 4.1.1, which needs a newer effect; pin in step (as swell does)
  "@effect/platform-node-shared": 4.0.2
patchedDependencies:
  "@agentclientprotocol/claude-agent-acp@0.84.0": patches/@agentclientprotocol__claude-agent-acp@0.84.0.patch
  "@agentclientprotocol/codex-acp@2.1.0": patches/@agentclientprotocol__codex-acp@2.1.0.patch
  vite-plus@0.2.1: patches/vite-plus@0.2.1.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@makeomatic/ffi-napi": true
  "@makeomatic/ref-napi": true
  bufferutil: false
  esbuild: true
  koffi: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - lucide-react@1.21.0
  - "@agentclientprotocol/codex-acp@2.1.0"
  - "@tanstack/react-virtual@3.14.22"
  - "@tanstack/virtual-core@3.19.7"
