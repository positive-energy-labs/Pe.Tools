packages:
  - apps/*
  - packages/*
  - tests/*
  - tools/*

catalogMode: prefer

catalog:
  "@assistant-ui/react": ^0.14.23
  "@assistant-ui/react-markdown": ^0.14.4
  "@base-ui/react": ^1.6.0
  "@tanstack/highlight": 0.0.10
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-hotkeys": ^0.10.0
  "@types/node": ^24
  ajv: ^8.20.0
  cmdk: ^1.1.1
  json-schema-to-typescript: ^15.0.4
  prism-react-editor: ^3.4.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1
  vite-plus: 0.2.1
overrides:
  vite: "catalog:"
  "@assistant-ui/tap": 0.9.5
  "@smithy/core": 3.33.3
  "@mastra/code-sdk@1.4.0>zod": 4.3.6
  "mastracode@0.35.0>zod": 4.3.6
patchedDependencies:
  # SHIM: Remove when upstream core supports owned target-thread renames, detached clones, and settled approval cleanup.
  "@mastra/core@1.61.0": patches/@mastra__core@1.61.0.patch
  # SHIM: Remove when upstream server treats explicit rename/delete/clone routes as target-thread operations.
  "@mastra/server@1.61.0": patches/@mastra__server@1.61.0.patch
  vite-plus@0.2.1: patches/vite-plus@0.2.1.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@google/genai": false
  "@makeomatic/ffi-napi": true
  "@makeomatic/ref-napi": true
  agent-browser: false
  bufferutil: false
  edgedriver: false
  esbuild: true
  geckodriver: false
  koffi: false
  msgpackr-extract: false
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAgeExclude:
  - lucide-react@1.21.0
  - "@mastra/client-js@1.42.0"
  - "@mastra/code-sdk@1.4.0"
  - "@mastra/core@1.61.0"
  - "@mastra/github-signals@0.2.2"
  - "@mastra/hono@1.7.1"
  - "@mastra/libsql@1.21.1"
  - "@mastra/mcp@1.13.1"
  - "@mastra/memory@1.27.0"
  - "@mastra/observability@1.15.2"
  - "@mastra/pg@1.14.2"
  - "@mastra/server@1.61.0"
  - mastracode@0.35.0
  - "@mastra/schema-compat@1.3.2-alpha.0"
  - "@mastra/duckdb@1.5.1"
  - "@mastra/playground-ui@40.0.1"
  - "@mastra/react@1.2.4"
